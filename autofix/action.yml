name: Autofix
description: "Automatically format and fix code."
outputs:
  javascript-detected:
    description: "Whether a JavaScript/TypeScript project was detected"
    value: ${{ steps.resolve_environment.outputs.javascript-detected }}
  javascript-runtime:
    description: "The JavaScript runtime used (node or bun)"
    value: ${{ steps.resolve_environment.outputs.javascript-runtime }}
  javascript-package-manager:
    description: "The JavaScript package manager used (npm, pnpm, or bun)"
    value: ${{ steps.resolve_environment.outputs.javascript-package-manager }}
  python-detected:
    description: "Whether Python source code was detected"
    value: ${{ steps.resolve_environment.outputs.python-detected }}
  python-package-manager:
    description: "The Python package manager detected (uv or pip)"
    value: ${{ steps.resolve_environment.outputs.python-package-manager }}

runs:
  using: "composite"
  steps:
    - name: Resolve environment
      shell: bash
      id: resolve_environment
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/resolve-environment.mjs"

    - name: Setup uv
      id: setup_uv
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.python-detected == 'true' && steps.resolve_environment.outputs.python-package-manager == 'uv' }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        enable-cache: true

    - name: Setup Python
      id: setup_python
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.python-detected == 'true' && steps.resolve_environment.outputs.python-package-manager != 'uv' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

    - name: Setup PNPM
      id: setup_pnpm
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.setup-pnpm == 'true' }}
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
      with:
        install: false
        cache: true

    - name: Setup Bun
      id: setup_bun
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.setup-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Setup Node.js
      id: setup_node
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: ${{ steps.resolve_environment.outputs.setup-node-cache }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Setup Ruff
      id: setup_ruff
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.python-detected == 'true' }}
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
      with:
        args: "--version"

    - name: Run autofix
      id: run_autofix
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && (steps.resolve_environment.outputs.javascript-detected == 'true' || steps.resolve_environment.outputs.python-detected == 'true') }}
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.javascript-package-manager }}
        RUNTIME: ${{ steps.resolve_environment.outputs.javascript-runtime }}
        ACTION_PATH: ${{ github.action_path }}
        NODE_SETUP_OUTCOME: ${{ steps.setup_node.outcome }}
        BUN_SETUP_OUTCOME: ${{ steps.setup_bun.outcome }}
        PNPM_SETUP_OUTCOME: ${{ steps.setup_pnpm.outcome }}
        UV_SETUP_OUTCOME: ${{ steps.setup_uv.outcome }}
        PY_SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
        RUFF_SETUP_OUTCOME: ${{ steps.setup_ruff.outcome }}
      run: node "$ACTION_PATH/../dist/autofix.mjs"

    - name: Run autofix.ci
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.run_autofix.outcome == 'success' && github.workflow == 'autofix.ci' }}
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
