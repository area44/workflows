name: Autofix (Lint and Format)
description: Automatically lint and format code using project-defined scripts and autofix.ci
inputs:
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.resolve_environment.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.resolve_environment.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.resolve_environment.outputs.runtime }}
  has-python-source:
    description: "Whether Python source code was detected"
    value: ${{ steps.resolve_environment.outputs.has-python-source }}
  python-version:
    description: "The Python version used"
    value: ${{ steps.resolve_environment.outputs.python-version }}
  python-package-manager:
    description: "The Python package manager detected (uv or pip)"
    value: ${{ steps.resolve_environment.outputs.python-package-manager }}
  ruff-version:
    description: "The Ruff version specified by the project or empty string for default"
    value: ${{ steps.resolve_environment.outputs.ruff-version }}

runs:
  using: "composite"
  steps:
    - name: Resolve environment
      shell: bash
      id: resolve_environment
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
      run: node "$ACTION_PATH/../dist/resolve-environment.mjs"

    - name: Setup uv
      if: ${{ steps.resolve_environment.outputs.has-python-source == 'true' && steps.resolve_environment.outputs.python-package-manager == 'uv' }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        python-version: ${{ steps.resolve_environment.outputs.python-version }}
        enable-cache: true

    - name: Setup Python
      if: ${{ steps.resolve_environment.outputs.has-python-source == 'true' && steps.resolve_environment.outputs.python-package-manager != 'uv' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ steps.resolve_environment.outputs.python-version }}

    - name: Setup PNPM
      if: ${{ steps.resolve_environment.outputs.setup-pnpm == 'true' }}
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
      with:
        version: ${{ steps.resolve_environment.outputs.package-manager-version }}
        runtime: ${{ steps.resolve_environment.outputs.pnpm-runtime }}
        install: false
        cache: true

    - name: Setup Bun
      if: ${{ steps.resolve_environment.outputs.setup-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.resolve_environment.outputs.bun-version }}

    - name: Setup Node.js
      if: ${{ steps.resolve_environment.outputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.resolve_environment.outputs.node-version }}
        cache: ${{ steps.resolve_environment.outputs.setup-node-cache }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Run autofix
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.package-manager }}
        RUNTIME: ${{ steps.resolve_environment.outputs.runtime }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$RUNTIME" = "bun" ]; then
          bun "$ACTION_PATH/../dist/autofix.mjs"
        else
          node "$ACTION_PATH/../dist/autofix.mjs"
        fi

    - name: Format Python code with Ruff
      if: ${{ steps.resolve_environment.outputs.has-python-source == 'true' }}
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
      with:
        version: ${{ steps.resolve_environment.outputs.ruff-version }}
        args: "format ."

    - name: Lint and fix Python code with Ruff
      if: ${{ steps.resolve_environment.outputs.has-python-source == 'true' }}
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
      with:
        version: ${{ steps.resolve_environment.outputs.ruff-version }}
        args: "check --fix ."

    - name: Run autofix.ci
      if: ${{ github.workflow == 'autofix.ci' }}
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
