name: Test Vite+ action
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Project
        run: |
          rm -rf vp-project
          mkdir -p vp-project
          cd vp-project
          echo '{"name": "vp-project"}' > package.json
          npm install --no-package-lock

      - name: Test Vite+ Action
        uses: ./vite-plus
        id: vite_plus_action
        with:
          path: vp-project/dist
          build-command: "mkdir -p vp-project/dist && touch vp-project/dist/index.html"

      - name: Verify Vite+ Outputs
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ -n "${{ steps.vite_plus_action.outputs.node-version }}" ]] || { echo "Node version output missing"; false; }
          EXPECTED_SITE="https://${OWNER}.github.io"
          if [[ "$REPO" == "${OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE is not set correctly: $SITE (expected $EXPECTED_SITE)"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE is not set correctly: $BASE (expected $EXPECTED_BASE)"; false; }
