name: Test Vite-Plus Composite Action
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-vite-plus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Isolate Workspace and Setup Project via Vite-Plus Mock
        run: |
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true
          cp -r __tests__/fixtures/vite-plus-project/* .
          bun install --no-frozen-lockfile || bun install

      - name: Test Vite-Plus Action
        uses: ./vite-plus
        id: vite_plus_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Verify Vite-Plus outputs
        run: |
          DETECTED_PM="${{ steps.vite_plus_action.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "bun" ]] || { echo "Expected bun, got $DETECTED_PM"; false; }

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO_NAME}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }

      - name: Restore Workspace Root
        if: always()
        run: |
          rm -rf node_modules package.json bun.lock dist
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
