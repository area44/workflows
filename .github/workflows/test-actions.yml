name: Test Actions
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-action:
    name: ${{ matrix.action }} (${{ matrix.runtime }}, ${{ matrix.pm }}, ${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pages action
          - action: pages
            runtime: node
            pm: npm
            type: basic
            fixture: pages/node/npm/basic
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: minimal
            fixture: pages/node/npm/minimal
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: vite
            fixture: pages/node/npm/vite
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: consumer
            fixture: pages/node/npm/consumer
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: basic
            fixture: pages/node/pnpm/basic
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: minimal
            fixture: pages/node/pnpm/minimal
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: minimal
            fixture: vite-plus/node/pnpm/minimal
            verify_site: true
          - action: pages
            runtime: node
            pm: bun
            type: basic
            fixture: pages/node/bun/basic
            verify_site: true
          - action: pages
            runtime: bun
            pm: bun
            type: basic
            fixture: pages/bun/bun/basic
            verify_site: true
          - action: pages
            runtime: bun
            pm: bun
            type: minimal
            fixture: pages/bun/bun/minimal
            verify_site: true
          - action: pages
            runtime: bun
            pm: pnpm
            type: basic
            fixture: pages/bun/pnpm/basic
            verify_site: true

          # JS Autofix action
          - action: autofix
            runtime: node
            pm: npm
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: minimal
            verify_site: false
          - action: autofix
            runtime: node
            pm: pnpm
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: pnpm
            type: minimal
            verify_site: false
          - action: autofix
            runtime: node
            pm: bun
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: bun
            type: minimal
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: basic
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: minimal
            verify_site: false
          - action: autofix
            runtime: bun
            pm: pnpm
            type: basic
            verify_site: false

          # Python Autofix action
          - action: autofix
            runtime: node
            pm: npm
            type: python-uv
            fixture: autofix/python/uv
            has_js_project: "false"
            has_python_source: "true"
            python_pm: uv
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-pip
            fixture: autofix/python/pip
            has_js_project: "false"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: ""
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-conflicting
            fixture: autofix/python/conflicting
            has_js_project: "false"
            has_python_source: "true"
            python_pm: uv
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-none
            fixture: autofix/python/none
            has_js_project: "false"
            has_python_source: "false"
            python_pm: ""
            python_version: ""
            ruff_version: ""
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: mixed
            fixture: autofix/python/mixed
            has_js_project: "true"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: mixed
            fixture: autofix/python/mixed-bun
            has_js_project: "true"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Workspace
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          if [ -n "$FIXTURE" ]; then
            FIXTURE_DIR="__tests__/fixtures/${FIXTURE}"
          else
            FIXTURE_DIR="__tests__/fixtures/${ACTION}/${RUNTIME}/${PM}/${TYPE}"
          fi
          if [ ! -d "$FIXTURE_DIR" ]; then
            echo "Error: Missing expected fixture directory for matrix combination '${ACTION} (${RUNTIME}, ${PM}, ${TYPE})': $FIXTURE_DIR"
            exit 1
          fi

          shopt -s dotglob
          TMP_FIX="${RUNNER_TEMP:-/tmp}/fixture_copy_$$"
          mkdir -p "$TMP_FIX"
          cp -r "$FIXTURE_DIR"/* "$TMP_FIX"/

          TMP_TESTS="${RUNNER_TEMP:-/tmp}/tests_stash_$$"
          mkdir -p "$TMP_TESTS"
          echo "$TMP_TESTS" > .stash_tests_path

          [ -d __tests__ ] && mv __tests__ "$TMP_TESTS"/__tests__ || true

          ROOT_ITEMS=(
            package.json
            package-lock.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            bun.lock
            tsconfig.json
            vite.config.ts
            astro.config.mjs
            index.html
            main.py
            app.py
            .node-version
            .bun-version
            .python-version
            pyproject.toml
            requirements.txt
            uv.lock
            uv.toml
            runtime.txt
            setup.py
            setup.cfg
          )

          touch .backed_up_files
          for item in "${ROOT_ITEMS[@]}"; do
            if [ -e "$item" ] && [ ! -e "${item}.bak" ]; then
              mv "$item" "${item}.bak"
              echo "$item" >> .backed_up_files
            fi
          done

          ls -1A "$TMP_FIX" > .copied_fixture_files
          while IFS= read -r item; do
            if [ -n "$item" ] && [ -e "$item" ] && [ ! -e "${item}.bak" ]; then
              mv "$item" "${item}.bak"
              echo "$item" >> .backed_up_files
            fi
          done < .copied_fixture_files

          cp -r "$TMP_FIX"/* .
          rm -rf "$TMP_FIX"

      - name: Test Pages Action
        if: matrix.action == 'pages'
        uses: ./pages
        id: pages
        with:
          runtime: ${{ matrix.runtime }}

      - name: Test Autofix Action
        if: matrix.action == 'autofix'
        uses: ./autofix
        id: autofix
        with:
          runtime: ${{ matrix.runtime }}

      - name: Verify outputs
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
          FIXTURE: ${{ matrix.fixture }}
          PAGES_PM: ${{ steps.pages.outputs.package-manager }}
          AUTOFIX_PM: ${{ steps.autofix.outputs.package-manager }}
          EXPECTED_PM: ${{ matrix.pm }}
          PAGES_RUNTIME: ${{ steps.pages.outputs.runtime }}
          AUTOFIX_RUNTIME: ${{ steps.autofix.outputs.runtime }}
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          PAGES_TOOLCHAIN: ${{ steps.pages.outputs.toolchain }}
          VERIFY_SITE: ${{ matrix.verify_site }}
          AUTOFIX_HAS_JS: ${{ steps.autofix.outputs.has-js-project }}
          AUTOFIX_HAS_PYTHON: ${{ steps.autofix.outputs.has-python-source }}
          AUTOFIX_PYTHON_PM: ${{ steps.autofix.outputs.python-package-manager }}
          AUTOFIX_PYTHON_VER: ${{ steps.autofix.outputs.python-version }}
          AUTOFIX_RUFF_VER: ${{ steps.autofix.outputs.ruff-version }}
          EXPECTED_HAS_JS_PROJECT: ${{ matrix.has_js_project }}
          EXPECTED_HAS_PYTHON_SOURCE: ${{ matrix.has_python_source }}
          EXPECTED_PYTHON_PM: ${{ matrix.python_pm }}
          EXPECTED_PYTHON_VER: ${{ matrix.python_version }}
          EXPECTED_RUFF_VER: ${{ matrix.ruff_version }}
        run: |
          if [ -f .stash_tests_path ]; then
            STASH_DIR=$(cat .stash_tests_path 2>/dev/null || true)
            TESTS_ROOT="${STASH_DIR}/__tests__"
          else
            TESTS_ROOT="__tests__"
          fi

          if [ -n "$FIXTURE" ]; then
            FIXTURE_PATH="${TESTS_ROOT}/fixtures/${FIXTURE}"
          else
            FIXTURE_PATH="${TESTS_ROOT}/fixtures/${ACTION}/${RUNTIME}/${PM}/${TYPE}"
          fi
          DETECTED_PM="${PAGES_PM}${AUTOFIX_PM}"
          if [[ "$DETECTED_PM" != "$EXPECTED_PM" ]]; then
            echo "Error: [${ACTION}] Package manager mismatch stage failed for fixture '${FIXTURE_PATH}'."
            echo "  Expected package manager: ${EXPECTED_PM}"
            echo "  Detected package manager: ${DETECTED_PM}"
            exit 1
          fi

          DETECTED_RUNTIME="${PAGES_RUNTIME}${AUTOFIX_RUNTIME}"
          if [[ "$DETECTED_RUNTIME" != "$EXPECTED_RUNTIME" ]]; then
            echo "Error: [${ACTION}] Runtime mismatch stage failed for fixture '${FIXTURE_PATH}'."
            echo "  Expected runtime: ${EXPECTED_RUNTIME}"
            echo "  Detected runtime: ${DETECTED_RUNTIME}"
            exit 1
          fi

          if [[ "$ACTION" == "pages" ]]; then
            EXPECTED_TOOLCHAIN="vite"
            if [[ "$FIXTURE" == "vite-plus/node/pnpm/minimal" ]]; then
              EXPECTED_TOOLCHAIN="vite-plus"
            fi
            DETECTED_TOOLCHAIN="${PAGES_TOOLCHAIN}"
            if [[ "$DETECTED_TOOLCHAIN" != "$EXPECTED_TOOLCHAIN" ]]; then
              echo "Error: [${ACTION}] Toolchain mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected toolchain: ${EXPECTED_TOOLCHAIN}"
              echo "  Detected toolchain: ${DETECTED_TOOLCHAIN}"
              exit 1
            fi
          fi

          if [[ "$ACTION" == "autofix" ]]; then
            EXPECTED_HAS_JS="${EXPECTED_HAS_JS_PROJECT:-true}"
            if [[ "$AUTOFIX_HAS_JS" != "$EXPECTED_HAS_JS" ]]; then
              echo "Error: [${ACTION}] Has JS project mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected has-js-project: ${EXPECTED_HAS_JS}"
              echo "  Actual has-js-project:   ${AUTOFIX_HAS_JS}"
              exit 1
            fi

            EXPECTED_HAS_PY="${EXPECTED_HAS_PYTHON_SOURCE:-false}"
            if [[ "$AUTOFIX_HAS_PYTHON" != "$EXPECTED_HAS_PY" ]]; then
              echo "Error: [${ACTION}] Has Python source mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected has-python-source: ${EXPECTED_HAS_PY}"
              echo "  Actual has-python-source:   ${AUTOFIX_HAS_PYTHON}"
              exit 1
            fi

            EXPECTED_PY_PM="${EXPECTED_PYTHON_PM:-}"
            if [[ "$AUTOFIX_PYTHON_PM" != "$EXPECTED_PY_PM" ]]; then
              echo "Error: [${ACTION}] Python package manager mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected python-package-manager: ${EXPECTED_PY_PM}"
              echo "  Actual python-package-manager:   ${AUTOFIX_PYTHON_PM}"
              exit 1
            fi

            EXPECTED_PY_VER="${EXPECTED_PYTHON_VER:-}"
            if [[ -n "$EXPECTED_PY_VER" && "$AUTOFIX_PYTHON_VER" != "$EXPECTED_PY_VER" ]]; then
              echo "Error: [${ACTION}] Python version mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected python-version: ${EXPECTED_PY_VER}"
              echo "  Actual python-version:   ${AUTOFIX_PYTHON_VER}"
              exit 1
            fi

            EXPECTED_RUFF="${EXPECTED_RUFF_VER:-}"
            if [[ "$AUTOFIX_RUFF_VER" != "$EXPECTED_RUFF" ]]; then
              echo "Error: [${ACTION}] Ruff version mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected ruff-version: ${EXPECTED_RUFF}"
              echo "  Actual ruff-version:   ${AUTOFIX_RUFF_VER}"
              exit 1
            fi
          fi

          echo "Verified fixture execution root for '${FIXTURE_PATH}'."

          if [[ "$VERIFY_SITE" == "true" ]]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              EXPECTED_BASE="/"
            else
              EXPECTED_BASE="/${REPO_NAME}/"
            fi
            if [[ "$SITE" != "$EXPECTED_SITE" ]]; then
              echo "Error: [${ACTION}] Site URL mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected SITE: ${EXPECTED_SITE}"
              echo "  Actual SITE:   ${SITE}"
              exit 1
            fi
            if [[ "$BASE" != "$EXPECTED_BASE" ]]; then
              echo "Error: [${ACTION}] Base URL mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected BASE: ${EXPECTED_BASE}"
              echo "  Actual BASE:   ${BASE}"
              exit 1
            fi

            if [[ ! -f "dist/index.html" ]]; then
              echo "Error: [${ACTION}] Artifact verification stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected build artifact 'dist/index.html' was not produced by action execution."
              exit 1
            fi
          fi

      - name: Restore Workspace Root
        if: always()
        run: |
          shopt -s dotglob
          if [ -f .copied_fixture_files ]; then
            while IFS= read -r item; do
              [ -n "$item" ] && rm -rf "$item"
            done < .copied_fixture_files
            rm -f .copied_fixture_files
          fi

          rm -rf node_modules dist .venv .ruff_cache *.egg-info

          if [ -f .backed_up_files ]; then
            while IFS= read -r item; do
              if [ -n "$item" ] && [ -e "${item}.bak" ]; then
                rm -rf "$item"
                mv "${item}.bak" "$item"
              fi
            done < .backed_up_files
            rm -f .backed_up_files
          fi

          if [ -f .stash_tests_path ]; then
            STASH_PATH=$(cat .stash_tests_path 2>/dev/null || true)
            if [ -n "$STASH_PATH" ] && [ -d "$STASH_PATH/__tests__" ]; then
              rm -rf __tests__
              mv "$STASH_PATH/__tests__" __tests__
              rm -rf "$STASH_PATH"
            fi
            rm -f .stash_tests_path
          fi
