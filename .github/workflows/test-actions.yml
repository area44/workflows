name: Test Actions
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-action:
    name: ${{ matrix.action }} (${{ matrix.runtime }}, ${{ matrix.pm }}, ${{ matrix.type }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.working_directory || '.' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pages action
          - action: pages
            runtime: node
            pm: npm
            type: basic
            fixture: pages/node/npm/basic
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: minimal
            fixture: pages/node/npm/minimal
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: vite
            fixture: pages/node/npm/vite
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: consumer
            fixture: pages/node/npm/consumer
            verify_site: true
            working_directory: __tests__/fixtures/pages/node/npm/consumer
          - action: pages
            runtime: node
            pm: pnpm
            type: basic
            fixture: pages/node/pnpm/basic
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: minimal
            fixture: pages/node/pnpm/minimal
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: minimal
            fixture: vite-plus/node/pnpm/minimal
            verify_site: true
          - action: pages
            runtime: node
            pm: bun
            type: basic
            fixture: pages/node/bun/basic
            verify_site: true
          - action: pages
            runtime: bun
            pm: bun
            type: basic
            fixture: pages/bun/bun/basic
            verify_site: true
          - action: pages
            runtime: bun
            pm: bun
            type: minimal
            fixture: pages/bun/bun/minimal
            verify_site: true
          - action: pages
            runtime: bun
            pm: pnpm
            type: basic
            fixture: pages/bun/pnpm/basic
            verify_site: true

          # Autofix action
          - action: autofix
            runtime: node
            pm: npm
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: minimal
            verify_site: false
          - action: autofix
            runtime: node
            pm: pnpm
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: pnpm
            type: minimal
            verify_site: false
          - action: autofix
            runtime: node
            pm: bun
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: bun
            type: minimal
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: basic
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: minimal
            verify_site: false
          - action: autofix
            runtime: bun
            pm: pnpm
            type: basic
            verify_site: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Workspace
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          if [ -n "$FIXTURE" ]; then
            FIXTURE_DIR="$GITHUB_WORKSPACE/__tests__/fixtures/${FIXTURE}"
          else
            FIXTURE_DIR="$GITHUB_WORKSPACE/__tests__/fixtures/${ACTION}/${RUNTIME}/${PM}/${TYPE}"
          fi
          if [ ! -d "$FIXTURE_DIR" ]; then
            echo "Error: Missing expected fixture directory for matrix combination '${ACTION} (${RUNTIME}, ${PM}, ${TYPE})': $FIXTURE_DIR"
            exit 1
          fi
          if [ "$TYPE" != "consumer" ]; then
            [ -f package.json ] && mv package.json package.json.bak || true
            [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true
            [ -f pnpm-lock.yaml ] && mv pnpm-lock.yaml pnpm-lock.yaml.bak || true
            [ -f pnpm-workspace.yaml ] && mv pnpm-workspace.yaml pnpm-workspace.yaml.bak || true
            [ -f bun.lock ] && mv bun.lock bun.lock.bak || true
            if [ "$ACTION" != "pages" ]; then
              [ -d pages ] && mv pages pages.bak || true
            fi
            cp -r "$FIXTURE_DIR"/* .
          fi

      - name: Test Pages Action
        if: matrix.action == 'pages'
        uses: ./pages
        id: pages
        with:
          runtime: ${{ matrix.runtime }}

      - name: Test Autofix Action
        if: matrix.action == 'autofix'
        uses: ./autofix
        id: autofix
        with:
          runtime: ${{ matrix.runtime }}

      - name: Verify outputs
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
          FIXTURE: ${{ matrix.fixture }}
          PAGES_PM: ${{ steps.pages.outputs.package-manager }}
          AUTOFIX_PM: ${{ steps.autofix.outputs.package-manager }}
          EXPECTED_PM: ${{ matrix.pm }}
          PAGES_RUNTIME: ${{ steps.pages.outputs.runtime }}
          AUTOFIX_RUNTIME: ${{ steps.autofix.outputs.runtime }}
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          PAGES_TOOLCHAIN: ${{ steps.pages.outputs.toolchain }}
          VERIFY_SITE: ${{ matrix.verify_site }}
        run: |
          if [ -n "$FIXTURE" ]; then
            FIXTURE_PATH="$GITHUB_WORKSPACE/__tests__/fixtures/${FIXTURE}"
          else
            FIXTURE_PATH="$GITHUB_WORKSPACE/__tests__/fixtures/${ACTION}/${RUNTIME}/${PM}/${TYPE}"
          fi
          DETECTED_PM="${PAGES_PM}${AUTOFIX_PM}"
          if [[ "$DETECTED_PM" != "$EXPECTED_PM" ]]; then
            echo "Error: [${ACTION}] Package manager mismatch stage failed for fixture '${FIXTURE_PATH}'."
            echo "  Expected package manager: ${EXPECTED_PM}"
            echo "  Detected package manager: ${DETECTED_PM}"
            exit 1
          fi

          DETECTED_RUNTIME="${PAGES_RUNTIME}${AUTOFIX_RUNTIME}"
          if [[ "$DETECTED_RUNTIME" != "$EXPECTED_RUNTIME" ]]; then
            echo "Error: [${ACTION}] Runtime mismatch stage failed for fixture '${FIXTURE_PATH}'."
            echo "  Expected runtime: ${EXPECTED_RUNTIME}"
            echo "  Detected runtime: ${DETECTED_RUNTIME}"
            exit 1
          fi

          if [[ "$ACTION" == "pages" ]]; then
            EXPECTED_TOOLCHAIN="vite"
            if [[ "$FIXTURE" == "vite-plus/node/pnpm/minimal" ]]; then
              EXPECTED_TOOLCHAIN="vite-plus"
            fi
            DETECTED_TOOLCHAIN="${PAGES_TOOLCHAIN}"
            if [[ "$DETECTED_TOOLCHAIN" != "$EXPECTED_TOOLCHAIN" ]]; then
              echo "Error: [${ACTION}] Toolchain mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected toolchain: ${EXPECTED_TOOLCHAIN}"
              echo "  Detected toolchain: ${DETECTED_TOOLCHAIN}"
              exit 1
            fi
          fi

          if [[ "$VERIFY_SITE" == "true" ]]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              EXPECTED_BASE="/"
            else
              EXPECTED_BASE="/${REPO_NAME}/"
            fi
            if [[ "$SITE" != "$EXPECTED_SITE" ]]; then
              echo "Error: [${ACTION}] Site URL mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected SITE: ${EXPECTED_SITE}"
              echo "  Actual SITE:   ${SITE}"
              exit 1
            fi
            if [[ "$BASE" != "$EXPECTED_BASE" ]]; then
              echo "Error: [${ACTION}] Base URL mismatch stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected BASE: ${EXPECTED_BASE}"
              echo "  Actual BASE:   ${BASE}"
              exit 1
            fi

            if [[ ! -f "dist/index.html" ]]; then
              echo "Error: [${ACTION}] Artifact verification stage failed for fixture '${FIXTURE_PATH}'."
              echo "  Expected build artifact 'dist/index.html' was not produced by action execution."
              exit 1
            fi
          fi

      - name: Restore Workspace Root
        if: always()
        run: |
          rm -rf node_modules dist
          if [ "${{ matrix.type }}" != "consumer" ]; then
            rm -rf package.json package-lock.json pnpm-lock.yaml pnpm-workspace.yaml bun.lock astro.config.mjs vite.config.ts index.html src .node-version
            if [ -d pages.bak ]; then
              mv pages.bak pages
            fi
            if [ -f package.json.bak ]; then
              mv package.json.bak package.json
            fi
            if [ -f package-lock.json.bak ]; then
              mv package-lock.json.bak package-lock.json
            fi
            if [ -f pnpm-lock.yaml.bak ]; then
              mv pnpm-lock.yaml.bak pnpm-lock.yaml
            fi
            if [ -f pnpm-workspace.yaml.bak ]; then
              mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
            fi
            if [ -f bun.lock.bak ]; then
              mv bun.lock.bak bun.lock
            fi
          fi

  test-build-output-validation:
    name: Test Build Output Validation Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Scenario A: Build succeeds but output is missing
      - name: "Scenario A: Missing output directory"
        id: scenario_a
        uses: ./pages
        continue-on-error: true
        with:
          build-command: "node -e 'process.exit(0)'"
          path: "missing-dist"

      - name: "Verify Scenario A failed before upload"
        run: |
          if [ "${{ steps.scenario_a.outcome }}" != "failure" ]; then
            echo "Error: Expected action to fail when build output directory is missing, but outcome was '${{ steps.scenario_a.outcome }}'."
            exit 1
          fi

      # Scenario B: Output path is a file
      - name: "Scenario B: Output path is a file"
        id: scenario_b_prep
        run: |
          echo "not a directory" > output-is-a-file.txt

      - name: "Run Action for Scenario B"
        id: scenario_b
        uses: ./pages
        continue-on-error: true
        with:
          build-command: "node -e 'process.exit(0)'"
          path: "output-is-a-file.txt"

      - name: "Verify Scenario B failed before upload"
        run: |
          if [ "${{ steps.scenario_b.outcome }}" != "failure" ]; then
            echo "Error: Expected action to fail when build output path is a file, but outcome was '${{ steps.scenario_b.outcome }}'."
            exit 1
          fi

      # Scenario C: Output directory is empty
      - name: "Scenario C: Empty output directory"
        id: scenario_c
        uses: ./pages
        continue-on-error: true
        with:
          build-command: "node -e 'require(\"fs\").mkdirSync(\"empty-dist\", { recursive: true })'"
          path: "empty-dist"

      - name: "Verify Scenario C failed before upload"
        run: |
          if [ "${{ steps.scenario_c.outcome }}" != "failure" ]; then
            echo "Error: Expected action to fail when build output directory is empty, but outcome was '${{ steps.scenario_c.outcome }}'."
            exit 1
          fi

      # Scenario D: Valid output directory
      - name: "Scenario D: Valid output directory"
        id: scenario_d
        uses: ./pages
        with:
          build-command: "node -e 'const fs = require(\"fs\"); fs.mkdirSync(\"valid-dist/assets\", { recursive: true }); fs.writeFileSync(\"valid-dist/index.html\", \"<h1>OK</h1>\"); fs.writeFileSync(\"valid-dist/assets/app.js\", \"console.log(1)\");'"
          path: "valid-dist"

      - name: "Verify Scenario D succeeded"
        run: |
          if [ "${{ steps.scenario_d.outcome }}" != "success" ]; then
            echo "Error: Expected action to succeed when build output is valid, but outcome was '${{ steps.scenario_d.outcome }}'."
            exit 1
          fi
          if [ ! -f "valid-dist/index.html" ]; then
            echo "Error: Expected 'valid-dist/index.html' to exist."
            exit 1
          fi
