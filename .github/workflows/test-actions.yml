name: Test Actions
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-action:
    name: ${{ matrix.action }} (${{ matrix.runtime }}, ${{ matrix.pm }}, ${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pages action - Positive scenarios
          - action: pages
            runtime: node
            pm: npm
            type: basic
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: vite
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: vite-plus
            toolchain: vite-plus
            verify_site: true
          - action: pages
            runtime: bun
            pm: bun
            type: basic
            verify_site: true

          # Pages action - Negative scenarios
          - action: pages
            runtime: node
            pm: npm
            type: basic
            build_command: "npm run invalid-command-12345"
            expected_failure: "true"
            verify_site: false
          - action: pages
            runtime: node
            pm: npm
            type: basic
            build_path: "non_existent_output_dir_99"
            expected_failure: "true"
            verify_site: false

          # JS Autofix action - Positive scenarios
          - action: autofix
            runtime: node
            pm: npm
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: pnpm
            type: basic
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: basic
            verify_site: false

          # Python Autofix action - Positive scenarios
          - action: autofix
            runtime: node
            pm: npm
            type: python-uv
            has_js_project: "false"
            has_python_source: "true"
            python_pm: uv
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-pip
            has_js_project: "false"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: ""
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-none
            has_js_project: "false"
            has_python_source: "false"
            python_pm: ""
            python_version: ""
            ruff_version: ""
            verify_site: false

          # Mixed JS + Python Autofix action - Positive scenarios
          - action: autofix
            runtime: node
            pm: npm
            type: mixed
            has_js_project: "true"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: mixed-bun
            has_js_project: "true"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false

    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: action-source

      - name: Setup Node.js Baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"

      - name: Generate Consumer Project Workspace
        run: |
          node action-source/.github/scripts/generate-consumer-project.js . \
            --action "${{ matrix.action }}" \
            --runtime "${{ matrix.runtime }}" \
            --pm "${{ matrix.pm }}" \
            --type "${{ matrix.type }}" \
            ${{ matrix.toolchain && format('--toolchain {0}', matrix.toolchain) || '' }} \
            ${{ matrix.has_js_project && format('--has-js-project {0}', matrix.has_js_project) || '' }} \
            ${{ matrix.has_python_source && format('--has-python-source {0}', matrix.has_python_source) || '' }} \
            ${{ matrix.python_pm && format('--python-pm {0}', matrix.python_pm) || '' }} \
            ${{ matrix.python_version && format('--python-version {0}', matrix.python_version) || '' }} \
            ${{ matrix.ruff_version != null && format('--ruff-version "{0}"', matrix.ruff_version) || '' }}

      - name: Test Pages Action
        if: matrix.action == 'pages'
        uses: ./action-source/pages
        id: pages
        continue-on-error: true
        with:
          runtime: ${{ matrix.runtime }}
          build-command: ${{ matrix.build_command }}
          path: ${{ matrix.build_path }}

      - name: Test Autofix Action
        if: matrix.action == 'autofix'
        uses: ./action-source/autofix
        id: autofix
        continue-on-error: true
        with:
          runtime: ${{ matrix.runtime }}

      - name: Verify outputs and outcomes
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
          EXPECTED_FAILURE: ${{ matrix.expected_failure }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          AUTOFIX_OUTCOME: ${{ steps.autofix.outcome }}
          PAGES_PM: ${{ steps.pages.outputs.package-manager }}
          AUTOFIX_PM: ${{ steps.autofix.outputs.package-manager }}
          EXPECTED_PM: ${{ matrix.pm }}
          PAGES_RUNTIME: ${{ steps.pages.outputs.runtime }}
          AUTOFIX_RUNTIME: ${{ steps.autofix.outputs.runtime }}
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          PAGES_TOOLCHAIN: ${{ steps.pages.outputs.toolchain }}
          EXPECTED_TOOLCHAIN_INPUT: ${{ matrix.toolchain }}
          VERIFY_SITE: ${{ matrix.verify_site }}
          AUTOFIX_HAS_JS: ${{ steps.autofix.outputs.has-js-project }}
          AUTOFIX_HAS_PYTHON: ${{ steps.autofix.outputs.has-python-source }}
          AUTOFIX_PYTHON_PM: ${{ steps.autofix.outputs.python-package-manager }}
          AUTOFIX_PYTHON_VER: ${{ steps.autofix.outputs.python-version }}
          AUTOFIX_RUFF_VER: ${{ steps.autofix.outputs.ruff-version }}
          EXPECTED_HAS_JS_PROJECT: ${{ matrix.has_js_project }}
          EXPECTED_HAS_PYTHON_SOURCE: ${{ matrix.has_python_source }}
          EXPECTED_PYTHON_PM: ${{ matrix.python_pm }}
          EXPECTED_PYTHON_VER: ${{ matrix.python_version }}
          EXPECTED_RUFF_VER: ${{ matrix.ruff_version }}
        run: |
          SCENARIO_NAME="${ACTION} (${RUNTIME}, ${PM}, ${TYPE})"

          if [[ "$ACTION" == "pages" ]]; then
            STEP_OUTCOME="$PAGES_OUTCOME"
          else
            STEP_OUTCOME="$AUTOFIX_OUTCOME"
          fi

          if [[ "$EXPECTED_FAILURE" == "true" ]]; then
            if [[ "$STEP_OUTCOME" != "failure" ]]; then
              echo "Error: Expected action step to fail for scenario '${SCENARIO_NAME}', but outcome was '${STEP_OUTCOME}'."
              exit 1
            fi
            echo "Verified negative scenario failure outcome for '${SCENARIO_NAME}'."
            exit 0
          fi

          if [[ "$STEP_OUTCOME" != "success" ]]; then
            echo "Error: Action execution failed unexpectedly for scenario '${SCENARIO_NAME}' with outcome '${STEP_OUTCOME}'."
            exit 1
          fi

          if [[ "$ACTION" == "pages" ]]; then
            DETECTED_PM="$PAGES_PM"
            DETECTED_RUNTIME="$PAGES_RUNTIME"
          else
            DETECTED_PM="$AUTOFIX_PM"
            DETECTED_RUNTIME="$AUTOFIX_RUNTIME"
          fi

          if [[ "$DETECTED_PM" != "$EXPECTED_PM" ]]; then
            echo "Error: [${ACTION}] Package manager mismatch stage failed for scenario '${SCENARIO_NAME}'."
            echo "  Expected package manager: ${EXPECTED_PM}"
            echo "  Detected package manager: ${DETECTED_PM}"
            exit 1
          fi

          if [[ "$DETECTED_RUNTIME" != "$EXPECTED_RUNTIME" ]]; then
            echo "Error: [${ACTION}] Runtime mismatch stage failed for scenario '${SCENARIO_NAME}'."
            echo "  Expected runtime: ${EXPECTED_RUNTIME}"
            echo "  Detected runtime: ${DETECTED_RUNTIME}"
            exit 1
          fi

          if [[ "$ACTION" == "pages" ]]; then
            EXPECTED_TOOLCHAIN="vite"
            if [[ "$TYPE" == "vite-plus" || "$EXPECTED_TOOLCHAIN_INPUT" == "vite-plus" ]]; then
              EXPECTED_TOOLCHAIN="vite-plus"
            elif [[ "$TYPE" == "basic" || "$TYPE" == "minimal" ]]; then
              EXPECTED_TOOLCHAIN="astro"
            fi
            DETECTED_TOOLCHAIN="${PAGES_TOOLCHAIN}"
            if [[ "$DETECTED_TOOLCHAIN" != "$EXPECTED_TOOLCHAIN" ]]; then
              echo "Error: [${ACTION}] Toolchain mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected toolchain: ${EXPECTED_TOOLCHAIN}"
              echo "  Detected toolchain: ${DETECTED_TOOLCHAIN}"
              exit 1
            fi
          fi

          if [[ "$ACTION" == "autofix" ]]; then
            EXPECTED_HAS_JS="${EXPECTED_HAS_JS_PROJECT:-true}"
            if [[ "$AUTOFIX_HAS_JS" != "$EXPECTED_HAS_JS" ]]; then
              echo "Error: [${ACTION}] Has JS project mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected has-js-project: ${EXPECTED_HAS_JS}"
              echo "  Actual has-js-project:   ${AUTOFIX_HAS_JS}"
              exit 1
            fi

            EXPECTED_HAS_PY="${EXPECTED_HAS_PYTHON_SOURCE:-false}"
            if [[ "$AUTOFIX_HAS_PYTHON" != "$EXPECTED_HAS_PY" ]]; then
              echo "Error: [${ACTION}] Has Python source mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected has-python-source: ${EXPECTED_HAS_PY}"
              echo "  Actual has-python-source:   ${AUTOFIX_HAS_PYTHON}"
              exit 1
            fi

            EXPECTED_PY_PM="${EXPECTED_PYTHON_PM:-}"
            if [[ "$AUTOFIX_PYTHON_PM" != "$EXPECTED_PY_PM" ]]; then
              echo "Error: [${ACTION}] Python package manager mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected python-package-manager: ${EXPECTED_PY_PM}"
              echo "  Actual python-package-manager:   ${AUTOFIX_PYTHON_PM}"
              exit 1
            fi

            if [[ "$EXPECTED_PYTHON_VER" != "" || "$TYPE" == "python-none" ]]; then
              EXPECTED_PY_VER="${EXPECTED_PYTHON_VER:-}"
              if [[ "$AUTOFIX_PYTHON_VER" != "$EXPECTED_PY_VER" ]]; then
                echo "Error: [${ACTION}] Python version mismatch stage failed for scenario '${SCENARIO_NAME}'."
                echo "  Expected python-version: '${EXPECTED_PY_VER}'"
                echo "  Actual python-version:   '${AUTOFIX_PYTHON_VER}'"
                exit 1
              fi
            fi

            EXPECTED_RUFF="${EXPECTED_RUFF_VER:-}"
            if [[ "$AUTOFIX_RUFF_VER" != "$EXPECTED_RUFF" ]]; then
              echo "Error: [${ACTION}] Ruff version mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected ruff-version: ${EXPECTED_RUFF}"
              echo "  Actual ruff-version:   ${AUTOFIX_RUFF_VER}"
              exit 1
            fi
          fi

          echo "Verified scenario execution root for '${SCENARIO_NAME}'."

          if [[ "$VERIFY_SITE" == "true" ]]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              EXPECTED_BASE="/"
            else
              EXPECTED_BASE="/${REPO_NAME}/"
            fi
            if [[ "$SITE" != "$EXPECTED_SITE" ]]; then
              echo "Error: [${ACTION}] Site URL mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected SITE: ${EXPECTED_SITE}"
              echo "  Actual SITE:   ${SITE}"
              exit 1
            fi
            if [[ "$BASE" != "$EXPECTED_BASE" ]]; then
              echo "Error: [${ACTION}] Base URL mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected BASE: ${EXPECTED_BASE}"
              echo "  Actual BASE:   ${BASE}"
              exit 1
            fi

            if [[ ! -f "dist/index.html" ]]; then
              echo "Error: [${ACTION}] Artifact verification stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected build artifact 'dist/index.html' was not produced by action execution."
              exit 1
            fi
          fi
