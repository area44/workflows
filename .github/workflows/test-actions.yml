name: Test Actions
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-action:
    name: ${{ matrix.action }} (${{ matrix.runtime }}, ${{ matrix.pm }}, ${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pages action - Positive scenarios
          - action: pages
            runtime: node
            pm: npm
            type: basic
            verify_site: true
          - action: pages
            runtime: node
            pm: npm
            type: vite
            verify_site: true
          - action: pages
            runtime: node
            pm: pnpm
            type: vite-plus
            toolchain: vite-plus
            verify_site: true
          - action: pages
            runtime: bun
            pm: bun
            type: basic
            verify_site: true

          # Pages action - Negative scenarios
          - action: pages
            runtime: node
            pm: npm
            type: basic
            build_command: "npm run invalid-command-12345"
            negative_type: "invalid_build_command"
            expected_failure: "true"
            verify_site: false
          - action: pages
            runtime: node
            pm: npm
            type: basic
            build_path: "non_existent_output_dir_99"
            negative_type: "missing_output_dir"
            expected_failure: "true"
            verify_site: false

          # JS Autofix action - Positive scenarios
          - action: autofix
            runtime: node
            pm: npm
            type: basic
            verify_site: false
          - action: autofix
            runtime: node
            pm: pnpm
            type: basic
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: basic
            verify_site: false

          # Python Autofix action - Positive scenarios
          - action: autofix
            runtime: node
            pm: npm
            type: python-uv
            has_js_project: "false"
            has_python_source: "true"
            python_pm: uv
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-pip
            has_js_project: "false"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: ""
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-conflicting
            has_js_project: "false"
            has_python_source: "true"
            python_pm: uv
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: node
            pm: npm
            type: python-none
            has_js_project: "false"
            has_python_source: "false"
            python_pm: ""
            python_version: ""
            ruff_version: ""
            verify_site: false

          # Mixed JS + Python Autofix action - Positive scenarios
          - action: autofix
            runtime: node
            pm: npm
            type: mixed
            has_js_project: "true"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false
          - action: autofix
            runtime: bun
            pm: bun
            type: mixed-bun
            has_js_project: "true"
            has_python_source: "true"
            python_pm: pip
            python_version: "3.12"
            ruff_version: "0.17.2"
            verify_site: false

    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: action-source

      - name: Setup Node.js Baseline
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"

      - name: Generate Consumer Project Workspace
        run: |
          node action-source/.github/scripts/generate-consumer-project.js . \
            --allow-non-empty \
            --action "${{ matrix.action }}" \
            --runtime "${{ matrix.runtime }}" \
            --pm "${{ matrix.pm }}" \
            --type "${{ matrix.type }}" \
            ${{ matrix.toolchain && format('--toolchain {0}', matrix.toolchain) || '' }} \
            ${{ matrix.has_js_project && format('--has-js-project {0}', matrix.has_js_project) || '' }} \
            ${{ matrix.has_python_source && format('--has-python-source {0}', matrix.has_python_source) || '' }} \
            ${{ matrix.python_pm && format('--python-pm {0}', matrix.python_pm) || '' }} \
            ${{ matrix.python_version && format('--python-version {0}', matrix.python_version) || '' }} \
            ${{ matrix.ruff_version != null && format('--ruff-version "{0}"', matrix.ruff_version) || '' }}

      - name: Clean Build Outputs Before Execution
        run: |
          TARGET_PATH="${{ matrix.build_path }}"
          TARGET_PATH="${TARGET_PATH:-dist}"
          rm -rf "$TARGET_PATH" dist
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -f "${RUNNER_TEMP}/pages_build_error.log"
          fi

      - name: Test Pages Action (Positive)
        if: matrix.action == 'pages' && matrix.expected_failure != 'true'
        uses: ./action-source/pages
        id: pages
        with:
          build-command: ${{ matrix.build_command }}
          path: ${{ matrix.build_path }}

      - name: Test Pages Action (Expected Failure Harness)
        if: matrix.action == 'pages' && matrix.expected_failure == 'true'
        id: pages_harness
        env:
          ACTION_PATH: ${{ github.workspace }}/action-source/pages
          BUILD_COMMAND: ${{ matrix.build_command }}
          BUILD_PATH: ${{ matrix.build_path }}
          EXPECTED_PM: ${{ matrix.pm }}
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          NEGATIVE_TYPE: ${{ matrix.negative_type }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -e
          node "$ACTION_PATH/../dist/resolve-environment.mjs"
          node "$ACTION_PATH/../dist/site-variables.mjs"

          ACTUAL_PM=$(node -e '
            const fs = require("fs");
            const file = process.env.GITHUB_OUTPUT;
            if (!file || !fs.existsSync(file)) process.exit(1);
            const content = fs.readFileSync(file, "utf8");
            const m = content.match(/javascript-package-manager<<(ghadelimiter_[^\n]+)\n([\s\S]*?)\n\1/) || content.match(/javascript-package-manager=(.*)/);
            if (m) console.log(m[2] !== undefined ? m[2].trim() : m[1].trim());
          ')

          ACTUAL_RUNTIME=$(node -e '
            const fs = require("fs");
            const file = process.env.GITHUB_OUTPUT;
            if (!file || !fs.existsSync(file)) process.exit(1);
            const content = fs.readFileSync(file, "utf8");
            const m = content.match(/javascript-runtime<<(ghadelimiter_[^\n]+)\n([\s\S]*?)\n\1/) || content.match(/javascript-runtime=(.*)/);
            if (m) console.log(m[2] !== undefined ? m[2].trim() : m[1].trim());
          ')

          if [ "$ACTUAL_PM" != "$EXPECTED_PM" ]; then
            echo "Error: Resolved package manager '$ACTUAL_PM' does not match expected '$EXPECTED_PM'"
            exit 1
          fi

          if [ "$ACTUAL_RUNTIME" != "$EXPECTED_RUNTIME" ]; then
            echo "Error: Resolved runtime '$ACTUAL_RUNTIME' does not match expected '$EXPECTED_RUNTIME'"
            exit 1
          fi

          export PACKAGE_MANAGER="$ACTUAL_PM"

          case "$ACTUAL_PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            npm) if [ -f "package-lock.json" ]; then npm ci; else npm install; fi ;;
            *) "$ACTUAL_PM" install ;;
          esac

          set +e
          node "$ACTION_PATH/../dist/build-command.mjs" > /dev/null 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 1 ]; then
            echo "Error: Expected build-command.mjs execution to fail with exit code 1 for scenario '$NEGATIVE_TYPE', but got $EXIT_CODE."
            exit 1
          fi

          ERROR_LOG_PATH="${RUNNER_TEMP}/pages_build_error.log"
          if [ ! -f "$ERROR_LOG_PATH" ]; then
            echo "Error: Build failure log '$ERROR_LOG_PATH' was not produced."
            exit 1
          fi

          ACTUAL_ERROR_MSG=$(cat "$ERROR_LOG_PATH")
          if [ "$NEGATIVE_TYPE" == "invalid_build_command" ]; then
            EXPECTED_SUBSTRING="Build command execution failed with exit code"
          elif [ "$NEGATIVE_TYPE" == "missing_output_dir" ]; then
            EXPECTED_SUBSTRING="Build output validation failed: Configured build output directory '${BUILD_PATH}' does not exist."
          else
            echo "Error: Unknown negative scenario type '$NEGATIVE_TYPE'."
            exit 1
          fi

          if [[ "$ACTUAL_ERROR_MSG" != *"$EXPECTED_SUBSTRING"* ]]; then
            echo "Error: Build error log content mismatch for '$NEGATIVE_TYPE'."
            echo "  Expected substring: '$EXPECTED_SUBSTRING'"
            echo "  Actual error log:   '$ACTUAL_ERROR_MSG'"
            exit 1
          fi

          echo "Captured expected failure in harness with exit code $EXIT_CODE and verified failure reason: '$ACTUAL_ERROR_MSG'"

      - name: Test Autofix Action
        if: matrix.action == 'autofix'
        uses: ./action-source/autofix
        id: autofix
        continue-on-error: true

      - name: Verify outputs and outcomes
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
          BUILD_PATH: ${{ matrix.build_path }}
          NEGATIVE_TYPE: ${{ matrix.negative_type }}
          EXPECTED_FAILURE: ${{ matrix.expected_failure }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          AUTOFIX_OUTCOME: ${{ steps.autofix.outcome }}
          PAGES_PM: ${{ steps.pages.outputs.javascript-package-manager }}
          AUTOFIX_PM: ${{ steps.autofix.outputs.javascript-package-manager }}
          EXPECTED_PM: ${{ matrix.pm }}
          PAGES_RUNTIME: ${{ steps.pages.outputs.javascript-runtime }}
          AUTOFIX_RUNTIME: ${{ steps.autofix.outputs.javascript-runtime }}
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          PAGES_TOOLCHAIN: ${{ steps.pages.outputs.javascript-toolchain }}
          EXPECTED_TOOLCHAIN_INPUT: ${{ matrix.toolchain }}
          VERIFY_SITE: ${{ matrix.verify_site }}
          AUTOFIX_HAS_JS: ${{ steps.autofix.outputs.javascript-detected }}
          AUTOFIX_HAS_PYTHON: ${{ steps.autofix.outputs.python-detected }}
          AUTOFIX_PYTHON_PM: ${{ steps.autofix.outputs.python-package-manager }}
          EXPECTED_HAS_JS_PROJECT: ${{ matrix.has_js_project }}
          EXPECTED_HAS_PYTHON_SOURCE: ${{ matrix.has_python_source }}
          EXPECTED_PYTHON_PM: ${{ matrix.python_pm }}
        run: |
          SCENARIO_NAME="${ACTION} (${RUNTIME}, ${PM}, ${TYPE})"

          if [[ "$ACTION" == "pages" ]]; then
            STEP_OUTCOME="$PAGES_OUTCOME"
            DETECTED_PM="$PAGES_PM"
            DETECTED_RUNTIME="$PAGES_RUNTIME"
          else
            STEP_OUTCOME="$AUTOFIX_OUTCOME"
            DETECTED_PM="$AUTOFIX_PM"
            DETECTED_RUNTIME="$AUTOFIX_RUNTIME"
          fi

          if [[ "$EXPECTED_FAILURE" == "true" ]]; then
            # Machine-verifiable failure reason check from pages_build_error.log
            ERROR_LOG_PATH="${RUNNER_TEMP}/pages_build_error.log"
            if [[ ! -f "$ERROR_LOG_PATH" ]]; then
              echo "Error: [${ACTION}] Build failure log '${ERROR_LOG_PATH}' was not produced. Failure occurred outside build_site step."
              exit 1
            fi

            ACTUAL_ERROR_MSG=$(cat "$ERROR_LOG_PATH")

            if [[ "$NEGATIVE_TYPE" == "invalid_build_command" ]]; then
              EXPECTED_SUBSTRING="Build command execution failed with exit code"
              if [[ "$ACTUAL_ERROR_MSG" != *"$EXPECTED_SUBSTRING"* ]]; then
                echo "Error: [${ACTION}] Failure reason mismatch for invalid_build_command scenario."
                echo "  Expected substring: '${EXPECTED_SUBSTRING}'"
                echo "  Actual error log:   '${ACTUAL_ERROR_MSG}'"
                exit 1
              fi
            elif [[ "$NEGATIVE_TYPE" == "missing_output_dir" ]]; then
              EXPECTED_SUBSTRING="Build output validation failed: Configured build output directory '${BUILD_PATH}' does not exist."
              if [[ "$ACTUAL_ERROR_MSG" != *"$EXPECTED_SUBSTRING"* ]]; then
                echo "Error: [${ACTION}] Failure reason mismatch for missing_output_dir scenario."
                echo "  Expected substring: '${EXPECTED_SUBSTRING}'"
                echo "  Actual error log:   '${ACTUAL_ERROR_MSG}'"
                exit 1
              fi
            fi

            echo "Verified exact failure reason for '${SCENARIO_NAME}': '${ACTUAL_ERROR_MSG}'"
            exit 0
          fi

          if [[ "$STEP_OUTCOME" != "success" ]]; then
            echo "Error: Action execution failed unexpectedly for scenario '${SCENARIO_NAME}' with outcome '${STEP_OUTCOME}'."
            exit 1
          fi

          if [[ "$DETECTED_PM" != "$EXPECTED_PM" ]]; then
            echo "Error: [${ACTION}] Package manager mismatch stage failed for scenario '${SCENARIO_NAME}'."
            echo "  Expected package manager: ${EXPECTED_PM}"
            echo "  Detected package manager: ${DETECTED_PM}"
            exit 1
          fi

          if [[ "$DETECTED_RUNTIME" != "$EXPECTED_RUNTIME" ]]; then
            echo "Error: [${ACTION}] Runtime mismatch stage failed for scenario '${SCENARIO_NAME}'."
            echo "  Expected runtime: ${EXPECTED_RUNTIME}"
            echo "  Detected runtime: ${DETECTED_RUNTIME}"
            exit 1
          fi

          if [[ "$ACTION" == "pages" ]]; then
            EXPECTED_TOOLCHAIN=""
            if [[ "$TYPE" == "vite-plus" || "$EXPECTED_TOOLCHAIN_INPUT" == "vite-plus" ]]; then
              EXPECTED_TOOLCHAIN="vite-plus"
            fi
            DETECTED_TOOLCHAIN="${PAGES_TOOLCHAIN}"
            if [[ "$DETECTED_TOOLCHAIN" != "$EXPECTED_TOOLCHAIN" ]]; then
              echo "Error: [${ACTION}] Toolchain mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected toolchain: '${EXPECTED_TOOLCHAIN}'"
              echo "  Detected toolchain: '${DETECTED_TOOLCHAIN}'"
              exit 1
            fi
          fi

          if [[ "$ACTION" == "autofix" ]]; then
            EXPECTED_HAS_JS="${EXPECTED_HAS_JS_PROJECT:-true}"
            if [[ "$AUTOFIX_HAS_JS" != "$EXPECTED_HAS_JS" ]]; then
              echo "Error: [${ACTION}] Has JS project mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected javascript-detected: ${EXPECTED_HAS_JS}"
              echo "  Actual javascript-detected:   ${AUTOFIX_HAS_JS}"
              exit 1
            fi

            EXPECTED_HAS_PY="${EXPECTED_HAS_PYTHON_SOURCE:-false}"
            if [[ "$AUTOFIX_HAS_PYTHON" != "$EXPECTED_HAS_PY" ]]; then
              echo "Error: [${ACTION}] Has Python source mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected python-detected: ${EXPECTED_HAS_PY}"
              echo "  Actual python-detected:   ${AUTOFIX_HAS_PYTHON}"
              exit 1
            fi

            EXPECTED_PY_PM="${EXPECTED_PYTHON_PM:-}"
            if [[ "$AUTOFIX_PYTHON_PM" != "$EXPECTED_PY_PM" ]]; then
              echo "Error: [${ACTION}] Python package manager mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected python-package-manager: ${EXPECTED_PY_PM}"
              echo "  Actual python-package-manager:   ${AUTOFIX_PYTHON_PM}"
              exit 1
            fi
          fi

          echo "Verified scenario execution root for '${SCENARIO_NAME}'."

          if [[ "$VERIFY_SITE" == "true" ]]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              EXPECTED_BASE="/"
            else
              EXPECTED_BASE="/${REPO_NAME}/"
            fi
            if [[ "$SITE" != "$EXPECTED_SITE" ]]; then
              echo "Error: [${ACTION}] Site URL mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected SITE: ${EXPECTED_SITE}"
              echo "  Actual SITE:   ${SITE}"
              exit 1
            fi
            if [[ "$BASE" != "$EXPECTED_BASE" ]]; then
              echo "Error: [${ACTION}] Base URL mismatch stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected BASE: ${EXPECTED_BASE}"
              echo "  Actual BASE:   ${BASE}"
              exit 1
            fi

            if [[ ! -f "dist/index.html" ]]; then
              echo "Error: [${ACTION}] Artifact verification stage failed for scenario '${SCENARIO_NAME}'."
              echo "  Expected build artifact 'dist/index.html' was not produced by action execution."
              exit 1
            fi
          fi
