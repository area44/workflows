name: Test Actions
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-action:
    name: ${{ matrix.action }} (${{ matrix.runtime }}, ${{ matrix.pm }}, ${{ matrix.type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Astro action
          - action: astro
            runtime: node
            pm: npm
            type: basic
            verify_site: true
          - action: astro
            runtime: node
            pm: npm
            type: minimal
            verify_site: true
          - action: astro
            runtime: node
            pm: pnpm
            type: basic
            verify_site: true
          - action: astro
            runtime: node
            pm: pnpm
            type: minimal
            verify_site: true
          - action: astro
            runtime: node
            pm: bun
            type: basic
            verify_site: true
          - action: astro
            runtime: node
            pm: bun
            type: minimal
            verify_site: true
          - action: astro
            runtime: bun
            pm: bun
            type: basic
            verify_site: true
          - action: astro
            runtime: bun
            pm: bun
            type: minimal
            verify_site: true
          - action: astro
            runtime: bun
            pm: pnpm
            type: basic
            verify_site: true

          # Lint-Format action
          - action: lint-format
            runtime: node
            pm: npm
            type: basic
            verify_site: false
          - action: lint-format
            runtime: node
            pm: npm
            type: minimal
            verify_site: false
          - action: lint-format
            runtime: node
            pm: pnpm
            type: basic
            verify_site: false
          - action: lint-format
            runtime: node
            pm: pnpm
            type: minimal
            verify_site: false
          - action: lint-format
            runtime: node
            pm: bun
            type: basic
            verify_site: false
          - action: lint-format
            runtime: node
            pm: bun
            type: minimal
            verify_site: false
          - action: lint-format
            runtime: bun
            pm: bun
            type: basic
            verify_site: false
          - action: lint-format
            runtime: bun
            pm: bun
            type: minimal
            verify_site: false
          - action: lint-format
            runtime: bun
            pm: pnpm
            type: basic
            verify_site: false

          # Vite action
          - action: vite
            runtime: node
            pm: npm
            type: basic
            verify_site: true
          - action: vite
            runtime: node
            pm: npm
            type: minimal
            verify_site: true
          - action: vite
            runtime: node
            pm: pnpm
            type: basic
            verify_site: true
          - action: vite
            runtime: node
            pm: pnpm
            type: minimal
            verify_site: true
          - action: vite
            runtime: node
            pm: bun
            type: basic
            verify_site: true
          - action: vite
            runtime: node
            pm: bun
            type: minimal
            verify_site: true
          - action: vite
            runtime: bun
            pm: bun
            type: basic
            verify_site: true
          - action: vite
            runtime: bun
            pm: bun
            type: minimal
            verify_site: true
          - action: vite
            runtime: bun
            pm: pnpm
            type: basic
            verify_site: true

          # Vite-Plus action
          - action: vite-plus
            runtime: node
            pm: npm
            type: basic
            verify_site: true
          - action: vite-plus
            runtime: node
            pm: npm
            type: minimal
            verify_site: true
          - action: vite-plus
            runtime: node
            pm: pnpm
            type: basic
            verify_site: true
          - action: vite-plus
            runtime: node
            pm: pnpm
            type: minimal
            verify_site: true
          - action: vite-plus
            runtime: node
            pm: bun
            type: basic
            verify_site: true
          - action: vite-plus
            runtime: node
            pm: bun
            type: minimal
            verify_site: true
          - action: vite-plus
            runtime: bun
            pm: bun
            type: basic
            verify_site: true
          - action: vite-plus
            runtime: bun
            pm: bun
            type: minimal
            verify_site: true
          - action: vite-plus
            runtime: bun
            pm: pnpm
            type: basic
            verify_site: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Workspace
        env:
          ACTION: ${{ matrix.action }}
          RUNTIME: ${{ matrix.runtime }}
          PM: ${{ matrix.pm }}
          TYPE: ${{ matrix.type }}
        run: |
          FIXTURE_DIR="__tests__/fixtures/${ACTION}/${RUNTIME}/${PM}/${TYPE}"
          if [ ! -d "$FIXTURE_DIR" ]; then
            echo "Error: Missing expected fixture directory for matrix combination '${ACTION} (${RUNTIME}, ${PM}, ${TYPE})': $FIXTURE_DIR"
            exit 1
          fi
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true
          [ -f pnpm-lock.yaml ] && mv pnpm-lock.yaml pnpm-lock.yaml.bak || true
          [ -f pnpm-workspace.yaml ] && mv pnpm-workspace.yaml pnpm-workspace.yaml.bak || true
          [ -f bun.lock ] && mv bun.lock bun.lock.bak || true
          cp -r "$FIXTURE_DIR"/* .

      - name: Test Astro Action
        if: matrix.action == 'astro'
        uses: ./astro
        id: astro
        with:
          runtime: ${{ matrix.runtime }}

      - name: Test Lint-Format Action
        if: matrix.action == 'lint-format'
        uses: ./lint-format
        id: lint-format
        with:
          runtime: ${{ matrix.runtime }}

      - name: Test Vite Action
        if: matrix.action == 'vite'
        uses: ./vite
        id: vite
        with:
          runtime: ${{ matrix.runtime }}

      - name: Test Vite-Plus Action
        if: matrix.action == 'vite-plus'
        uses: ./vite-plus
        id: vite-plus
        with:
          runtime: ${{ matrix.runtime }}

      - name: Verify outputs
        env:
          ASTRO_PM: ${{ steps.astro.outputs.package-manager }}
          LINT_FORMAT_PM: ${{ steps.lint-format.outputs.package-manager }}
          VITE_PM: ${{ steps.vite.outputs.package-manager }}
          VITE_PLUS_PM: ${{ steps.vite-plus.outputs.package-manager }}
          EXPECTED_PM: ${{ matrix.pm }}
          ASTRO_RUNTIME: ${{ steps.astro.outputs.runtime }}
          LINT_FORMAT_RUNTIME: ${{ steps.lint-format.outputs.runtime }}
          VITE_RUNTIME: ${{ steps.vite.outputs.runtime }}
          VITE_PLUS_RUNTIME: ${{ steps.vite-plus.outputs.runtime }}
          EXPECTED_RUNTIME: ${{ matrix.runtime }}
          VERIFY_SITE: ${{ matrix.verify_site }}
        run: |
          DETECTED_PM="${ASTRO_PM}${LINT_FORMAT_PM}${VITE_PM}${VITE_PLUS_PM}"
          [[ "$DETECTED_PM" == "$EXPECTED_PM" ]] || { echo "Expected PM $EXPECTED_PM, got $DETECTED_PM"; false; }

          DETECTED_RUNTIME="${ASTRO_RUNTIME}${LINT_FORMAT_RUNTIME}${VITE_RUNTIME}${VITE_PLUS_RUNTIME}"
          [[ "$DETECTED_RUNTIME" == "$EXPECTED_RUNTIME" ]] || { echo "Expected runtime $EXPECTED_RUNTIME, got $DETECTED_RUNTIME"; false; }

          if [[ "$VERIFY_SITE" == "true" ]]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              EXPECTED_BASE="/"
            else
              EXPECTED_BASE="/${REPO_NAME}/"
            fi
            [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
            [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }
          fi

      - name: Restore Workspace Root
        if: always()
        run: |
          rm -rf node_modules package.json package-lock.json pnpm-lock.yaml pnpm-workspace.yaml bun.lock dist astro.config.mjs vite.config.ts index.html src .node-version
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
          if [ -f pnpm-lock.yaml.bak ]; then
            mv pnpm-lock.yaml.bak pnpm-lock.yaml
          fi
          if [ -f pnpm-workspace.yaml.bak ]; then
            mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
          fi
          if [ -f bun.lock.bak ]; then
            mv bun.lock.bak bun.lock
          fi
