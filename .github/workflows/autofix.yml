name: autofix.ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js for build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        shell: bash
        run: |
          for artifact in dist/resolve-environment.mjs dist/autofix.mjs dist/site-variables.mjs dist/build-command.mjs; do
            if [ ! -f "$artifact" ]; then
              echo "Error: Required build artifact '$artifact' is missing." >&2
              exit 1
            fi
          done

      - name: Run autofix
        uses: ./autofix
