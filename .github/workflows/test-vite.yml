name: Test Vite Composite Action
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-vite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Install PNPM
        run: npm install -g pnpm@9

      - name: Isolate Workspace and Setup Project via Vite Mock
        run: |
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true
          cp -r __tests__/fixtures/vite-project/* .
          pnpm install --no-frozen-lockfile

      - name: Test Vite Action
        uses: ./vite
        id: vite_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Verify Vite outputs
        run: |
          DETECTED_PM="${{ steps.vite_action.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "pnpm" ]] || { echo "Expected pnpm, got $DETECTED_PM"; false; }

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO_NAME}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }

      - name: Restore Workspace Root
        if: always()
        run: |
          rm -rf node_modules package.json pnpm-lock.yaml dist
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
