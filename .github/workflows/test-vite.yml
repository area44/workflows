name: Test Vite action
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Project
        run: |
          rm -rf vite-project
          mkdir -p vite-project
          cd vite-project
          echo '{"name": "vite-project", "scripts": {"build": "mkdir -p dist && touch dist/index.html" }}' > package.json
          npm install --no-package-lock

      - name: Test Vite Action
        uses: ./vite
        id: vite_action
        with:
          path: vite-project/dist
          build-command: "cd vite-project && npm run build"

      - name: Verify Vite Outputs
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ -n "${{ steps.vite_action.outputs.node-version }}" ]] || { echo "Node version output missing"; false; }
          EXPECTED_SITE="https://${OWNER}.github.io"
          if [[ "$REPO" == "${OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE is not set correctly: $SITE (expected $EXPECTED_SITE)"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE is not set correctly: $BASE (expected $EXPECTED_BASE)"; false; }
