name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build:
    name: Unit test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve environment
        shell: bash
        id: resolve_environment
        run: node "dist/resolve-environment.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.resolve_environment.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        run: |
          # 1. Dynamically verify expected artifacts derived from vite.config.ts
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";

            const configContent = fs.readFileSync("vite.config.ts", "utf8");
            const packMatch = configContent.match(/pack:\s*\[([\s\S]*?)\]\.map/);
            if (!packMatch || !packMatch[1]) {
              console.error("Error: Could not derive pack entries from vite.config.ts");
              process.exit(1);
            }

            const names = Array.from(packMatch[1].matchAll(/"([^"]+)"/g)).map(m => m[1]);
            const expectedFiles = names.map(n => `dist/${n}.mjs`);
            const missingFiles = expectedFiles.filter(f => !fs.existsSync(f));

            if (missingFiles.length > 0) {
              console.error("Error: Missing expected generated build artifacts:");
              missingFiles.forEach(f => console.error(` - ${f}`));
              process.exit(1);
            }

            const emptyFiles = expectedFiles.filter(f => fs.statSync(f).size === 0);
            if (emptyFiles.length > 0) {
              console.error("Error: Found empty generated build artifacts:");
              emptyFiles.forEach(f => console.error(` - ${f}`));
              process.exit(1);
            }

            const distFiles = fs.readdirSync("dist");
            const expectedNames = new Set(expectedFiles.map(f => path.basename(f)));
            const unexpectedFiles = distFiles.filter(f => !expectedNames.has(f));
            if (unexpectedFiles.length > 0) {
              console.error("Error: Found unexpected files in dist/ directory:");
              unexpectedFiles.forEach(f => console.error(` - dist/${f}`));
              process.exit(1);
            }

            console.log("Verified all expected generated artifacts exist:", expectedFiles);
          '

          # 2. Enforce working tree cleanliness for dist/
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "Error: Generated artifacts in 'dist/' are stale, modified, or out of sync with source files."
            echo "Please run 'npm run build' locally and commit the updated 'dist/' files."
            git status --porcelain dist/
            git diff dist/
            exit 1
          fi
