name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build:
    name: Unit test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve environment
        shell: bash
        id: resolve_environment
        run: node "dist/resolve-environment.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.resolve_environment.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Validate Changeset in PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          NON_DOC_FILES=$(echo "$CHANGED_FILES" | grep -vE '^(\.changeset\/|docs\/|.*\.md$)' || true)
          CHANGESET_FILES=$(echo "$CHANGED_FILES" | grep -E '^\.changeset\/.*\.md$' | grep -vE '(\/README\.md$|\/config\.json$)' || true)

          if [ -n "$NON_DOC_FILES" ]; then
            if [ -z "$CHANGESET_FILES" ]; then
              echo "Error: Pull request introduces code or configuration changes without a changeset file in .changeset/."
              echo "Please run 'npx changeset' to add a changeset file describing your changes."
              exit 1
            fi
            for file in $CHANGESET_FILES; do
              if [ ! -s "$file" ]; then
                echo "Error: Changeset file '$file' is empty."
                exit 1
              fi
            done
          fi

      - name: Run tests
        run: npm test
