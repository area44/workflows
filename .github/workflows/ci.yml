name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build:
    name: Unit test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve environment
        shell: bash
        id: resolve_environment
        run: node "dist/resolve-environment.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6c050c480ff640003f4ee92470c98 # v4.1.0
        with:
          node-version: ${{ steps.resolve_environment.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Validate Changeset in PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          NON_DOC_FILES=$(echo "$CHANGED_FILES" | grep -vE '^(\.changeset\/|docs\/|.*\.md$)' || true)
          CHANGESET_FILES=$(echo "$CHANGED_FILES" | grep -E '^\.changeset\/.*\.md$' | grep -vE '(\/README\.md$|\/config\.json$)' || true)

          if [ -n "$NON_DOC_FILES" ] && [ -z "$CHANGESET_FILES" ]; then
            echo "Error: Pull request introduces code or configuration changes without a changeset."
            echo "Please run 'npx changeset' to create a changeset file for your PR."
            exit 1
          fi

      - name: Run tests
        run: npm test
