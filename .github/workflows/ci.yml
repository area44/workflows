name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Unit Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect enviroment
        shell: bash
        id: detect_env
        run: node "dist/detect-env.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run Main Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/detect-env.mjs && test -f dist/run-scripts.mjs

  test-actions:
    name: Test Composite Action (${{ matrix.action }} - ${{ matrix.pm }} - ${{ matrix.type }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        action: [astro, lint-format, vite, vite-plus]
        pm: [npm, pnpm, bun]
        type: [basic, minimal]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Isolate Workspace and Setup Project via Mock
        run: |
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true
          [ -f pnpm-lock.yaml ] && mv pnpm-lock.yaml pnpm-lock.yaml.bak || true
          [ -f pnpm-workspace.yaml ] && mv pnpm-workspace.yaml pnpm-workspace.yaml.bak || true
          [ -f bun.lock ] && mv bun.lock bun.lock.bak || true
          cp -r __tests__/fixtures/${{ matrix.action }}/${{ matrix.pm }}/${{ matrix.type }}/* .

      - name: Test Astro Action
        if: matrix.action == 'astro'
        uses: ./astro
        id: astro_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Test Lint-Format Action
        if: matrix.action == 'lint-format'
        uses: ./lint-format
        id: lint_format_action

      - name: Test Vite Action
        if: matrix.action == 'vite'
        uses: ./vite
        id: vite_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Test Vite-Plus Action
        if: matrix.action == 'vite-plus'
        uses: ./vite-plus
        id: vite_plus_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Verify Action outputs
        run: |
          if [ "${{ matrix.action }}" = "astro" ]; then
            DETECTED_PM="${{ steps.astro_action.outputs.package-manager }}"
          elif [ "${{ matrix.action }}" = "lint-format" ]; then
            DETECTED_PM="${{ steps.lint_format_action.outputs.package-manager }}"
          elif [ "${{ matrix.action }}" = "vite" ]; then
            DETECTED_PM="${{ steps.vite_action.outputs.package-manager }}"
          elif [ "${{ matrix.action }}" = "vite-plus" ]; then
            DETECTED_PM="${{ steps.vite_plus_action.outputs.package-manager }}"
          fi

          [[ "$DETECTED_PM" == "${{ matrix.pm }}" ]] || { echo "Expected ${{ matrix.pm }}, got $DETECTED_PM"; false; }

          if [ "${{ matrix.action }}" != "lint-format" ]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
              EXPECTED_BASE="/"
            else
              EXPECTED_BASE="/${REPO_NAME}/"
            fi
            [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
            [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }
          fi

      - name: Restore Workspace Root
        if: always()
        run: |
          rm -rf node_modules package.json package-lock.json pnpm-lock.yaml pnpm-workspace.yaml bun.lock dist
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
          if [ -f pnpm-lock.yaml.bak ]; then
            mv pnpm-lock.yaml.bak pnpm-lock.yaml
          fi
          if [ -f pnpm-workspace.yaml.bak ]; then
            mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
          fi
          if [ -f bun.lock.bak ]; then
            mv bun.lock.bak bun.lock
          fi
