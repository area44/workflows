name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build:
    name: Unit test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve environment
        shell: bash
        id: resolve_environment
        run: node "dist/resolve-environment.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.resolve_environment.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        run: npm run verify:artifacts

      - name: Verify repository version
        run: npm run verify:version

      - name: Verify upgrade guardrails
        env:
          BASE_REF: ${{ github.base_ref || github.event.before }}
        run: npm run verify:upgrade

      - name: Verify documentation consistency
        run: npm run verify:docs

      - name: Verify repository health
        run: npm run verify:health

      - name: Run tests
        run: npm test
