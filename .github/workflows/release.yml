name: Release

on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release / Version PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve environment
        shell: bash
        id: resolve_environment
        run: node "dist/resolve-environment.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6c050c480ff640003f4ee92470c98 # v4.1.0
        with:
          node-version: ${{ steps.resolve_environment.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Create Version PR or Tag Release
        id: changesets
        uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1.4.10
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Git Tags and Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --tags || true
          for tag in $(git tag --points-at HEAD); do
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --generate-notes --title "$tag" || true
            fi
          done
