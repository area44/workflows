name: Test Matrix Environments
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        if: ${{ matrix.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: ${{ matrix.package-manager != 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.11.0"

      - name: Install PNPM
        if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install -g pnpm

      - name: Setup Mock Project
        run: |
          rm -rf test-project
          mkdir -p test-project
          cd test-project
          echo '{"name": "test-project", "scripts": {"build": "mkdir -p dist && touch dist/index.html", "lint": "echo lint", "format": "echo format"}}' > package.json

          case "${{ matrix.package-manager }}" in
            npm)
              npm install --no-package-lock
              touch package-lock.json
              ;;
            pnpm)
              pnpm install --no-frozen-lockfile
              ;;
            yarn)
              yarn install --no-node-linker
              touch yarn.lock
              ;;
            bun)
              bun install
              ;;
          esac

      - name: Test Vite Action
        uses: ./vite
        id: vite_action
        with:
          path: test-project/dist
          build-command: "cd test-project && ${{ matrix.package-manager }} run build"

      - name: Verify Vite Action outputs
        run: |
          [[ "${{ steps.vite_action.outputs.package-manager }}" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got ${{ steps.vite_action.outputs.package-manager }}"; false; }

      - name: Test Astro Action
        uses: ./astro
        id: astro_action
        with:
          path: test-project/dist
          build-command: "cd test-project && ${{ matrix.package-manager }} run build"

      - name: Verify Astro Action outputs
        run: |
          [[ "${{ steps.astro_action.outputs.package-manager }}" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got ${{ steps.astro_action.outputs.package-manager }}"; false; }

      - name: Test Lint/Format Action
        uses: ./lint-format
        id: lint_format_action

      - name: Verify Lint/Format Action outputs
        run: |
          [[ "${{ steps.lint_format_action.outputs.package-manager }}" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got ${{ steps.lint_format_action.outputs.package-manager }}"; false; }
