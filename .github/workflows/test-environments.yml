name: Test Matrix Environments
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Lint-Format with Node (npm) - Pinned Node
          - tool: lint-format
            package-manager: npm
            runtime: node
            node-version: "22.13.0"
          # 2. Lint-Format with Node (npm) - Unpinned Node
          - tool: lint-format
            package-manager: npm
            runtime: node
            node-version: "no-pin"
          # 3. Lint-Format with Bun (bun) - Pinned Bun
          - tool: lint-format
            package-manager: bun
            runtime: bun
            bun-version: "1.1.0"
          # 4. Lint-Format with Bun (bun) - Unpinned Bun
          - tool: lint-format
            package-manager: bun
            runtime: bun
            bun-version: "latest"
          # 5. Astro with Node (pnpm) - Pinned Node
          - tool: astro
            package-manager: pnpm
            runtime: node
            node-version: "20.11.0"
          # 6. Astro with Node (pnpm) - Unpinned Node
          - tool: astro
            package-manager: pnpm
            runtime: node
            node-version: "no-pin"
          # 7. Astro with Bun (bun) - Pinned Bun
          - tool: astro
            package-manager: bun
            runtime: bun
            bun-version: "1.1.0"
          # 8. Vite with Node (yarn) - Pinned Node
          - tool: vite
            package-manager: yarn
            runtime: node
            node-version: "22.13.0"
          # 9. Vite with Node (yarn) - Unpinned Node
          - tool: vite
            package-manager: yarn
            runtime: node
            node-version: "no-pin"
          # 10. Vite with Bun (bun) - Unpinned Bun
          - tool: vite
            package-manager: bun
            runtime: bun
            bun-version: "latest"
          # 11. Vite-Plus with Node (pnpm) - Pinned Node
          - tool: vite-plus
            package-manager: pnpm
            runtime: node
            node-version: "22.13.0"
          # 12. Vite-Plus with Node (npm) - Unpinned Node
          - tool: vite-plus
            package-manager: npm
            runtime: node
            node-version: "no-pin"
          # 13. Vite-Plus with Bun (bun) - Pinned Bun
          - tool: vite-plus
            package-manager: bun
            runtime: bun
            bun-version: "1.1.0"
          # 14. Astro with Node (yarn) - Unpinned Node
          - tool: astro
            package-manager: yarn
            runtime: node
            node-version: "no-pin"
          # 15. Vite with Node (bun) - Pinned Node
          - tool: vite
            package-manager: bun
            runtime: node
            node-version: "22.13.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun (Pinned)
        if: ${{ matrix.runtime == 'bun' && matrix.bun-version != 'no-pin' && matrix.bun-version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Bun (if package manager is Bun but runtime is Node)
        if: ${{ matrix.package-manager == 'bun' && matrix.runtime == 'node' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Bun (Unpinned/No-setup)
        if: ${{ matrix.runtime == 'bun' && matrix.bun-version == 'no-pin' }}
        run: |
          which bun || curl -fsSL https://bun.sh/install | bash

      - name: Setup Node.js (Pinned)
        if: ${{ matrix.runtime == 'node' && matrix.node-version != 'no-pin' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Node.js (Unpinned/No-setup)
        if: ${{ matrix.runtime == 'node' && matrix.node-version == 'no-pin' }}
        run: |
          node --version

      - name: Install PNPM (Compat-friendly version v9)
        if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install -g pnpm@9

      - name: Isolate Workspace and Setup Project
        run: |
          # Backup original root package.json and lockfile if they exist
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true

          # Create isolated mock project
          echo '{"name": "mock-project", "packageManager": "${{ matrix.package-manager }}@latest", "dependencies": {"minimist": "^1.2.8"}, "scripts": {"build": "mkdir -p dist && touch dist/index.html", "lint": "echo linting...", "format": "echo formatting..."}}' > package.json

          # Generate appropriate lockfiles for detection and ensure cache files resolve
          case "${{ matrix.package-manager }}" in
            npm)
              npm install
              ;;
            pnpm)
              pnpm install --no-frozen-lockfile
              ;;
            yarn)
              yarn install --no-node-linker
              ;;
            bun)
              bun install
              ;;
          esac

      - name: Test Environment Detection (Direct Verification)
        id: detect_env
        env:
          GITHUB_ACTION_PATH: /home/runner/work/_actions/owner/repo/v1/${{ matrix.tool }}
          GITHUB_REPOSITORY: owner/project-repo
          GITHUB_REPOSITORY_OWNER: owner
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun "dist/detect-env.mjs"
          else
            node "dist/detect-env.mjs"
          fi

      - name: Verify Environment Detection outputs
        env:
          GITHUB_ACTION_PATH: /home/runner/work/_actions/owner/repo/v1/${{ matrix.tool }}
          GITHUB_REPOSITORY: owner/project-repo
          GITHUB_REPOSITORY_OWNER: owner
        run: |
          # Re-detect SITE and BASE directly in the asserting environment
          # to ensure they are available in GITHUB_ENV or process.env
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            eval $(bun "dist/detect-env.mjs" | grep -E '^Set (SITE|BASE)=' | sed 's/Set //')
          else
            eval $(node "dist/detect-env.mjs" | grep -E '^Set (SITE|BASE)=' | sed 's/Set //')
          fi

          # Assert GHA output values
          DETECTED_PM="${{ steps.detect_env.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got $DETECTED_PM"; false; }

          # Assert env variables set by detect-env.mjs
          if [[ "${{ matrix.tool }}" == "astro" || "${{ matrix.tool }}" == "vite" || "${{ matrix.tool }}" == "vite-plus" ]]; then
            [[ "$SITE" == "https://owner.github.io" ]] || { echo "SITE not set correctly: $SITE"; false; }
            [[ "$BASE" == "/project-repo/" ]] || { echo "BASE not set correctly: $BASE"; false; }
          else
            [[ -z "$SITE" ]] || { echo "SITE should not be set for ${{ matrix.tool }}"; false; }
          fi

      - name: Test Run Scripts (Direct Verification)
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun "dist/run-scripts.mjs"
          else
            node "dist/run-scripts.mjs"
          fi

      - name: Restore Workspace Root
        if: always()
        run: |
          # Clean up generated files to prevent contamination
          rm -rf node_modules package.json package-lock.json pnpm-lock.yaml yarn.lock bun.lock node-modules

          # Restore backups if they exist
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
