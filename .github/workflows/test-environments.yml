name: Test Matrix Environments
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Astro with Node (pnpm) - Pinned Node
          - tool: astro
            package-manager: pnpm
            runtime: node
            node-version: "20.11.0"
          # 2. Astro with Node (pnpm) - Unpinned Node
          - tool: astro
            package-manager: pnpm
            runtime: node
            node-version: "no-pin"
          # 3. Astro with Bun (bun) - Pinned Bun
          - tool: astro
            package-manager: bun
            runtime: bun
            bun-version: "1.1.0"
          # 4. Vite with Node (yarn) - Pinned Node
          - tool: vite
            package-manager: yarn
            runtime: node
            node-version: "22.13.0"
          # 5. Vite with Node (yarn) - Unpinned Node
          - tool: vite
            package-manager: yarn
            runtime: node
            node-version: "no-pin"
          # 6. Vite with Bun (bun) - Unpinned Bun
          - tool: vite
            package-manager: bun
            runtime: bun
            bun-version: "latest"
          # 7. Vite-Plus with Node (pnpm) - Pinned Node
          - tool: vite-plus
            package-manager: pnpm
            runtime: node
            node-version: "22.13.0"
          # 8. Vite-Plus with Node (npm) - Unpinned Node
          - tool: vite-plus
            package-manager: npm
            runtime: node
            node-version: "no-pin"
          # 9. Vite-Plus with Bun (bun) - Pinned Bun
          - tool: vite-plus
            package-manager: bun
            runtime: bun
            bun-version: "1.1.0"
          # 10. Astro with Node (yarn) - Unpinned Node
          - tool: astro
            package-manager: yarn
            runtime: node
            node-version: "no-pin"
          # 11. Vite with Node (bun) - Pinned Node
          - tool: vite
            package-manager: bun
            runtime: node
            node-version: "22.13.0"
          # 12. Lint-Format with Node (pnpm)
          - tool: lint-format
            package-manager: pnpm
            runtime: node
            node-version: "22.13.0"
          # 13. Lint-Format with Node (npm)
          - tool: lint-format
            package-manager: npm
            runtime: node
            node-version: "no-pin"
          # 14. Lint-Format with Node (yarn)
          - tool: lint-format
            package-manager: yarn
            runtime: node
            node-version: "no-pin"
          # 15. Lint-Format with Bun (bun)
          - tool: lint-format
            package-manager: bun
            runtime: bun
            bun-version: "1.1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun (Pinned)
        if: ${{ matrix.runtime == 'bun' && matrix.bun-version != 'no-pin' && matrix.bun-version != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Bun (if package manager is Bun but runtime is Node)
        if: ${{ matrix.package-manager == 'bun' && matrix.runtime == 'node' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Bun (Unpinned/No-setup)
        if: ${{ matrix.runtime == 'bun' && matrix.bun-version == 'no-pin' }}
        run: |
          which bun || curl -fsSL https://bun.sh/install | bash

      - name: Setup Node.js (Pinned)
        if: ${{ matrix.runtime == 'node' && matrix.node-version != 'no-pin' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Node.js (Unpinned/No-setup)
        if: ${{ matrix.runtime == 'node' && matrix.node-version == 'no-pin' }}
        run: |
          node --version

      - name: Install PNPM (Compat-friendly version v9)
        if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install -g pnpm@9

      - name: Isolate Workspace and Setup Project via Fixtures
        run: |
          # Backup original root package.json and lockfile if they exist
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true

          # Copy mock project structure from committed fixtures folder to workspace root
          cp -r __tests__/fixtures/${{ matrix.package-manager }}-project/* .

          # Ensure the package manager runs install successfully and touch standard lockfile on completion
          case "${{ matrix.package-manager }}" in
            npm)
              npm ci
              ;;
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
          esac

      - name: Test Astro Action
        if: ${{ matrix.tool == 'astro' }}
        uses: ./astro
        id: astro_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Verify Astro outputs
        if: ${{ matrix.tool == 'astro' }}
        run: |
          # Dynamically assert package-manager and node-version GHA outputs
          DETECTED_PM="${{ steps.astro_action.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got $DETECTED_PM"; false; }

          # Verify GHA exported SITE/BASE variables
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO_NAME}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }

      - name: Test Vite Action
        if: ${{ matrix.tool == 'vite' }}
        uses: ./vite
        id: vite_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Verify Vite outputs
        if: ${{ matrix.tool == 'vite' }}
        run: |
          DETECTED_PM="${{ steps.vite_action.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got $DETECTED_PM"; false; }

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO_NAME}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }

      - name: Test Vite-Plus Action
        if: ${{ matrix.tool == 'vite-plus' }}
        uses: ./vite-plus
        id: vite_plus_action
        with:
          path: dist
          build-command: "mkdir -p dist && touch dist/index.html"

      - name: Verify Vite-Plus outputs
        if: ${{ matrix.tool == 'vite-plus' }}
        run: |
          DETECTED_PM="${{ steps.vite_plus_action.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got $DETECTED_PM"; false; }

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          EXPECTED_SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          if [[ "$REPO_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            EXPECTED_BASE="/"
          else
            EXPECTED_BASE="/${REPO_NAME}/"
          fi
          [[ "$SITE" == "$EXPECTED_SITE" ]] || { echo "SITE mismatches: $SITE"; false; }
          [[ "$BASE" == "$EXPECTED_BASE" ]] || { echo "BASE mismatches: $BASE"; false; }

      - name: Test Lint-Format Action
        if: ${{ matrix.tool == 'lint-format' }}
        uses: ./lint-format
        id: lint_format_action
        with:
          node-version: ${{ matrix.node-version != 'no-pin' && matrix.node-version || '' }}

      - name: Verify Lint-Format outputs
        if: ${{ matrix.tool == 'lint-format' }}
        run: |
          DETECTED_PM="${{ steps.lint_format_action.outputs.package-manager }}"
          [[ "$DETECTED_PM" == "${{ matrix.package-manager }}" ]] || { echo "Expected ${{ matrix.package-manager }}, got $DETECTED_PM"; false; }

      - name: Restore Workspace Root
        if: always()
        run: |
          # Clean up copied and generated files
          rm -rf node_modules package.json package-lock.json pnpm-lock.yaml yarn.lock bun.lock node-modules dist package-lock.json

          # Restore backups if they exist
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
