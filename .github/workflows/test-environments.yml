name: Test Matrix Environments
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        if: ${{ matrix.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: ${{ matrix.package-manager != 'bun' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Install PNPM
        if: ${{ matrix.package-manager == 'pnpm' }}
        run: npm install -g pnpm

      - name: Isolate Workspace and Setup Project
        run: |
          # Backup original root package.json and lockfile if they exist
          [ -f package.json ] && mv package.json package.json.bak || true
          [ -f package-lock.json ] && mv package-lock.json package-lock.json.bak || true

          # Create isolated mock project with a realistic dependency
          echo '{"name": "mock-project", "dependencies": {"minimist": "^1.2.8"}, "scripts": {"lint": "echo linting...", "format": "echo formatting..."}}' > package.json

          # Generate appropriate lockfiles for detection and ensure cache files resolve
          case "${{ matrix.package-manager }}" in
            npm)
              npm install
              ;;
            pnpm)
              pnpm install --no-frozen-lockfile
              ;;
            yarn)
              yarn install --no-node-linker
              ;;
            bun)
              bun install
              ;;
          esac

      - name: Test Environment Detection (Direct Verification)
        id: detect_env
        run: |
          node "dist/detect-env.mjs"
          [[ -f "dist/detect-env.mjs" ]] || { echo "detect-env.mjs missing"; false; }

      - name: Test Run Scripts (Direct Verification)
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: |
          if [ "${{ matrix.package-manager }}" = "bun" ]; then
            bun "dist/run-scripts.mjs"
          else
            node "dist/run-scripts.mjs"
          fi

      - name: Restore Workspace Root
        if: always()
        run: |
          # Clean up generated files to prevent contamination
          rm -rf node-modules package.json package-lock.json pnpm-lock.yaml yarn.lock bun.lock node_modules

          # Restore backups if they exist
          if [ -f package.json.bak ]; then
            mv package.json.bak package.json
          fi
          if [ -f package-lock.json.bak ]; then
            mv package-lock.json.bak package-lock.json
          fi
