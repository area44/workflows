name: Build and Deploy Vite Site
description: Optimized build and deployment for Vite projects on GitHub Pages
inputs:
  path:
    description: "The directory where the built site is located"
    required: false
    default: "dist"
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false
  build-command:
    description: "Optional build command override"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.detect_env.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.detect_env.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.detect_env.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.detect_env.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.detect_env.outputs.runtime }}

runs:
  using: "composite"
  steps:
    - name: Detect environment
      shell: bash
      id: detect_env
      run: node "${{ github.action_path }}/../dist/detect-env.mjs"

    - name: Setup PNPM
      if: ${{ steps.detect_env.outputs.package-manager == 'pnpm' }}
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
      with:
        version: ${{ steps.detect_env.outputs.package-manager-version }}
        runtime: ${{ steps.detect_env.outputs.bun-version != '' && format('bun@{0}', steps.detect_env.outputs.bun-version) || format('node@{0}', steps.detect_env.outputs.node-version && !startsWith(steps.detect_env.outputs.node-version, 'lts') && steps.detect_env.outputs.node-version || 'lts') }}
        install: false
        cache: true

    - name: Setup Bun
      if: ${{ steps.detect_env.outputs.package-manager != 'pnpm' && steps.detect_env.outputs.bun-version != '' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.detect_env.outputs.bun-version }}

    - name: Setup Node.js
      if: ${{ steps.detect_env.outputs.package-manager != 'pnpm' && steps.detect_env.outputs.node-version != '' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.detect_env.outputs.node-version }}
        cache: ${{ steps.detect_env.outputs.package-manager }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Install dependencies
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect_env.outputs.package-manager }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        case "$PM" in
          pnpm)
            pnpm install --frozen-lockfile
            ;;
          bun)
            bun install --frozen-lockfile
            ;;
          npm)
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            ;;
          *)
            "$PM" install
            ;;
        esac

    - name: Build Vite site
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect_env.outputs.package-manager }}
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        if [[ -n "$BUILD_COMMAND" ]]; then
          eval "$BUILD_COMMAND"
        else
          "$PM" run build
        fi

    - name: Upload site artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ inputs.path }}
