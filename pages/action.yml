name: Build and Upload GitHub Pages Site
description: "Build and deploy static sites to GitHub Pages."
inputs:
  path:
    description: "Directory where the built site is located"
    required: false
    default: "dist"
  build-command:
    description: "Custom build command"
    required: false

outputs:
  javascript-detected:
    description: "Whether a JavaScript/TypeScript project was detected"
    value: ${{ steps.resolve_environment.outputs.javascript-detected }}
  javascript-runtime:
    description: "The JavaScript runtime used (node or bun)"
    value: ${{ steps.resolve_environment.outputs.javascript-runtime }}
  javascript-runtime-version:
    description: "The version of the JavaScript runtime used"
    value: ${{ steps.resolve_environment.outputs.javascript-runtime-version }}
  javascript-package-manager:
    description: "The JavaScript package manager used (npm, pnpm, or bun)"
    value: ${{ steps.resolve_environment.outputs.javascript-package-manager }}
  javascript-package-manager-version:
    description: "The version of the JavaScript package manager used"
    value: ${{ steps.resolve_environment.outputs.javascript-package-manager-version }}
  javascript-toolchain:
    description: "The resolved toolchain (vite-plus or empty string)"
    value: ${{ steps.resolve_environment.outputs.javascript-toolchain }}
  vp-version:
    description: "The version of Vite+ installed"
    value: ${{ steps.setup_vp.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Resolve environment
      shell: bash
      id: resolve_environment
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/resolve-environment.mjs"

    - name: Set site variables
      id: set_site_variables
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/site-variables.mjs"

    - name: Setup PNPM
      id: setup_pnpm
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.setup-pnpm == 'true' }}
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
      with:
        version: ${{ steps.resolve_environment.outputs.javascript-package-manager-version }}
        runtime: ${{ steps.resolve_environment.outputs.pnpm-runtime }}
        install: false
        cache: true

    - name: Setup Bun
      id: setup_bun
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.setup-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.resolve_environment.outputs.bun-version }}

    - name: Setup Node.js
      id: setup_node
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.resolve_environment.outputs.node-version }}
        cache: ${{ steps.resolve_environment.outputs.setup-node-cache }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Setup Vite+
      id: setup_vp
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.javascript-toolchain == 'vite-plus' }}
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
      with:
        node-version: ${{ steps.resolve_environment.outputs.node-version }}
        cache: true
        run-install: true

    - name: Install dependencies
      id: install_dependencies
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.resolve_environment.outputs.javascript-toolchain != 'vite-plus' }}
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.javascript-package-manager }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        case "$PM" in
          pnpm)
            pnpm install --frozen-lockfile
            ;;
          bun)
            bun install --frozen-lockfile
            ;;
          npm)
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            ;;
          *)
            "$PM" install
            ;;
        esac

    - name: Build site
      id: build_site
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && (steps.install_dependencies.outcome == 'success' || steps.setup_vp.outcome == 'success') }}
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.javascript-package-manager }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        DEFAULT_BUILD_COMMAND: ${{ steps.resolve_environment.outputs.javascript-toolchain == 'vite-plus' && 'vp build' || '' }}
        BUILD_PATH: ${{ inputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/build-command.mjs"

    - name: Upload site artifact
      if: ${{ !cancelled() && steps.resolve_environment.outcome == 'success' && steps.build_site.outcome == 'success' }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ steps.build_site.outputs.path }}
