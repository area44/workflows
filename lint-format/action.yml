name: Lint and Format
description: Automatically lint and format code using project-defined scripts and autofix.ci
inputs:
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.resolve_environment.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.resolve_environment.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.resolve_environment.outputs.runtime }}
  has-js:
    description: "Whether JavaScript/TypeScript was detected"
    value: ${{ steps.resolve_environment.outputs.has-js }}
  has-python:
    description: "Whether Python was detected"
    value: ${{ steps.resolve_environment.outputs.has-python }}
  has-uv:
    description: "Whether uv was detected for Python dependency management"
    value: ${{ steps.resolve_environment.outputs.has-uv }}
  python-version:
    description: "The Python version used"
    value: ${{ steps.resolve_environment.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - name: Resolve environment
      shell: bash
      id: resolve_environment
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
      run: node "$ACTION_PATH/../dist/resolve-environment.mjs"

    - name: Setup PNPM
      if: ${{ steps.resolve_environment.outputs.has-js == 'true' && steps.resolve_environment.outputs.setup-pnpm == 'true' }}
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
      with:
        version: ${{ steps.resolve_environment.outputs.package-manager-version }}
        runtime: ${{ steps.resolve_environment.outputs.pnpm-runtime }}
        install: false
        cache: true

    - name: Setup Bun
      if: ${{ steps.resolve_environment.outputs.has-js == 'true' && steps.resolve_environment.outputs.setup-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.resolve_environment.outputs.bun-version }}

    - name: Setup Node.js
      if: ${{ steps.resolve_environment.outputs.has-js == 'true' && steps.resolve_environment.outputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.resolve_environment.outputs.node-version }}
        cache: ${{ steps.resolve_environment.outputs.setup-node-cache }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Install dependencies
      if: ${{ steps.resolve_environment.outputs.has-js == 'true' }}
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.package-manager }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        case "$PM" in
          pnpm)
            pnpm install --no-frozen-lockfile
            ;;
          bun)
            bun install
            ;;
          npm)
            npm install
            ;;
          *)
            "$PM" install
            ;;
        esac

    - name: Setup Python
      if: ${{ steps.resolve_environment.outputs.has-python == 'true' }}
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: ${{ steps.resolve_environment.outputs.python-version }}

    - name: Setup uv
      if: ${{ steps.resolve_environment.outputs.has-python == 'true' && steps.resolve_environment.outputs.has-uv == 'true' }}
      uses: astral-sh/setup-uv@f94380b06b00080f55cf5544d67e106ef3e31375 # v5
      with:
        enable-cache: true

    - name: Run lint and format
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.package-manager }}
        RUNTIME: ${{ steps.resolve_environment.outputs.runtime }}
        HAS_JS: ${{ steps.resolve_environment.outputs.has-js }}
        HAS_PYTHON: ${{ steps.resolve_environment.outputs.has-python }}
        HAS_UV: ${{ steps.resolve_environment.outputs.has-uv }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$RUNTIME" = "bun" ]; then
          bun "$ACTION_PATH/../dist/lint-format.mjs"
        else
          node "$ACTION_PATH/../dist/lint-format.mjs"
        fi

    - name: Run autofix.ci
      if: ${{ github.workflow == 'autofix.ci' }}
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
