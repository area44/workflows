name: Lint and Format
description: Automatically lint and format code using project-defined scripts and autofix.ci
inputs:
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.detect_env.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.detect_env.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.detect_env.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.detect_env.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.detect_env.outputs.runtime }}

runs:
  using: "composite"
  steps:
    - name: Detect environment
      shell: bash
      id: detect_env
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
      run: node "$ACTION_PATH/../dist/detect-env.mjs"

    - name: Setup PNPM
      if: ${{ steps.detect_env.outputs.package-manager == 'pnpm' }}
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
      with:
        version: ${{ steps.detect_env.outputs.package-manager-version }}
        runtime: ${{ steps.detect_env.outputs.pnpm-runtime }}
        install: false
        cache: true

    - name: Setup Bun
      if: ${{ steps.detect_env.outputs.package-manager != 'pnpm' && steps.detect_env.outputs.bun-version != '' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.detect_env.outputs.bun-version }}

    - name: Setup Node.js
      if: ${{ steps.detect_env.outputs.package-manager != 'pnpm' && steps.detect_env.outputs.node-version != '' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.detect_env.outputs.node-version }}
        cache: ${{ steps.detect_env.outputs.package-manager == 'npm' && 'npm' || '' }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Install dependencies
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect_env.outputs.package-manager }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        case "$PM" in
          pnpm)
            pnpm install --no-frozen-lockfile
            ;;
          bun)
            bun install
            ;;
          npm)
            npm install
            ;;
          *)
            "$PM" install
            ;;
        esac

    - name: Run lint and format
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect_env.outputs.package-manager }}
        RUNTIME: ${{ steps.detect_env.outputs.runtime }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$RUNTIME" = "bun" ]; then
          bun "$ACTION_PATH/../dist/lint-format.mjs"
        else
          node "$ACTION_PATH/../dist/lint-format.mjs"
        fi

    - name: Run autofix.ci
      if: ${{ github.workflow == 'autofix.ci' }}
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
