name: Lint and Format
description: Automatically lint and format code using project-defined scripts and autofix.ci
inputs:
  node-version:
    description: "Optional Node.js version override"
    required: false
  bun-version:
    description: "Optional Bun version override"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.detect_env.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ inputs.bun-version || steps.detect_env.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.detect_env.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.detect_env.outputs.package-manager-version }}

runs:
  using: "composite"
  steps:
    - name: Detect environment
      shell: bash
      id: detect_env
      run: node "${{ github.action_path }}/../dist/detect-env.mjs"

    - name: Setup Bun
      if: ${{ steps.detect_env.outputs.package-manager == 'bun' || inputs.bun-version || steps.detect_env.outputs.bun-version }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version || steps.detect_env.outputs.bun-version || steps.detect_env.outputs.package-manager-version }}

    - name: Setup PNPM
      if: ${{ steps.detect_env.outputs.package-manager == 'pnpm' }}
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
      with:
        version: ${{ steps.detect_env.outputs.package-manager-version }}
        runtime: ${{ (inputs.bun-version || steps.detect_env.outputs.bun-version) && format('bun@{0}', inputs.bun-version || steps.detect_env.outputs.bun-version) || format('node@{0}', (inputs.node-version || steps.detect_env.outputs.node-version) && !startsWith(inputs.node-version || steps.detect_env.outputs.node-version, 'lts') && (inputs.node-version || steps.detect_env.outputs.node-version) || 'lts') }}
        install: false
        cache: true

    - name: Setup Node.js
      if: ${{ steps.detect_env.outputs.package-manager != 'pnpm' && steps.detect_env.outputs.package-manager != 'bun' && !inputs.bun-version && !steps.detect_env.outputs.bun-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version || steps.detect_env.outputs.node-version }}
        cache: ${{ steps.detect_env.outputs.package-manager }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Install dependencies
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect_env.outputs.package-manager }}
        BUN_VERSION: ${{ inputs.bun-version || steps.detect_env.outputs.bun-version }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        if [ "$PM" = "bun" ] || [ -n "$BUN_VERSION" ]; then
          if [ "$PM" != "pnpm" ]; then
            PM="bun"
          fi
        fi
        case "$PM" in
          pnpm)
            pnpm install --no-frozen-lockfile
            ;;
          bun)
            bun install
            ;;
          npm)
            npm install
            ;;
          *)
            "$PM" install
            ;;
        esac

    - name: Run lint/format scripts
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.detect_env.outputs.package-manager }}
        BUN_VERSION: ${{ inputs.bun-version || steps.detect_env.outputs.bun-version }}
      run: |
        if [ "${{ steps.detect_env.outputs.package-manager }}" = "bun" ] || [ -n "$BUN_VERSION" ]; then
          bun "${{ github.action_path }}/../dist/run-lint-format.mjs"
        else
          node "${{ github.action_path }}/../dist/run-lint-format.mjs"
        fi

    - name: Run autofix.ci
      if: ${{ github.workflow == 'autofix.ci' }}
      uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
