name: Build and Deploy Astro Site
description: Optimized build and deployment for Astro projects on GitHub Pages
inputs:
  path:
    description: "Directory where the built site is located"
    required: false
    default: "dist"
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false
  build-command:
    description: "Custom build command"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.resolve_environment.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.resolve_environment.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.resolve_environment.outputs.runtime }}

runs:
  using: "composite"
  steps:
    - name: Resolve environment
      shell: bash
      id: resolve_environment
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
      run: node "$ACTION_PATH/../dist/resolve-environment.mjs"

    - name: Set site variables
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/site-variables.mjs"

    - name: Setup PNPM
      if: ${{ steps.resolve_environment.outputs.setup-pnpm == 'true' }}
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
      with:
        version: ${{ steps.resolve_environment.outputs.package-manager-version }}
        runtime: ${{ steps.resolve_environment.outputs.pnpm-runtime }}
        install: false
        cache: true

    - name: Setup Bun
      if: ${{ steps.resolve_environment.outputs.setup-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.resolve_environment.outputs.bun-version }}

    - name: Setup Node.js
      if: ${{ steps.resolve_environment.outputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.resolve_environment.outputs.node-version }}
        cache: ${{ steps.resolve_environment.outputs.setup-node-cache }}
        cache-dependency-path: |
          **/package-lock.json

    - name: Install dependencies
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.package-manager }}
      run: |
        PM="${PACKAGE_MANAGER:-npm}"
        case "$PM" in
          pnpm)
            pnpm install --frozen-lockfile
            ;;
          bun)
            bun install --frozen-lockfile
            ;;
          npm)
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            ;;
          *)
            "$PM" install
            ;;
        esac

    - name: Build Astro site
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.package-manager }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        RUNTIME: ${{ steps.resolve_environment.outputs.runtime }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "$RUNTIME" = "bun" ]; then
          bun "$ACTION_PATH/../dist/build-command.mjs"
        else
          node "$ACTION_PATH/../dist/build-command.mjs"
        fi

    - name: Upload site artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ inputs.path }}
