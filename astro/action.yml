name: Build and Deploy Astro Site
description: "Optimized build and deployment for Astro projects on GitHub Pages (deprecated: use area44/workflows/pages instead)"
inputs:
  path:
    description: "Directory where the built site is located"
    required: false
    default: "dist"
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false
  build-command:
    description: "Custom build command"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.pages.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.pages.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.pages.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.pages.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.pages.outputs.runtime }}

runs:
  using: "composite"
  steps:
    - name: Delegate to Pages action
      id: pages
      uses: ./pages
      with:
        path: ${{ inputs.path }}
        runtime: ${{ inputs.runtime }}
        build-command: ${{ inputs.build-command }}
