name: Build and Deploy Vite+ Site
description: Optimized build and deployment for Vite+ projects on GitHub Pages
inputs:
  path:
    description: "Directory where the built site is located"
    required: false
    default: "dist"
  runtime:
    description: "Optional runtime and version override (e.g. node@24, bun@1.4)"
    required: false
  build-command:
    description: "Custom build command"
    required: false

outputs:
  node-version:
    description: "The Node.js version used"
    value: ${{ steps.resolve_environment.outputs.node-version }}
  bun-version:
    description: "The Bun version used"
    value: ${{ steps.resolve_environment.outputs.bun-version }}
  package-manager:
    description: "The package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager }}
  package-manager-version:
    description: "The version of the package manager used"
    value: ${{ steps.resolve_environment.outputs.package-manager-version }}
  runtime:
    description: "The runtime used (node or bun)"
    value: ${{ steps.resolve_environment.outputs.runtime }}
  vp-version:
    description: "The version of Vite+ installed"
    value: ${{ steps.setup_vp.outputs.vp-version }}

runs:
  using: "composite"
  steps:
    - name: Resolve environment
      shell: bash
      id: resolve_environment
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
      run: node "$ACTION_PATH/../dist/resolve-environment.mjs"

    - name: Set site variables
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/site-variables.mjs"

    - name: Setup Vite+
      id: setup_vp
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
      with:
        node-version: ${{ steps.resolve_environment.outputs.node-version }}
        cache: true
        run-install: true

    - name: Build Vite+ site
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.resolve_environment.outputs.package-manager }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        DEFAULT_BUILD_COMMAND: "vpr build"
        RUNTIME: ${{ steps.resolve_environment.outputs.runtime }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/../dist/build-command.mjs"

    - name: Upload site artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ inputs.path }}
